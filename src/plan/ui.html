/* ===== welcome animation ===== */
.tb-splash{position:fixed;inset:0;z-index:20000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center;background:radial-gradient(circle at 30% 20%,rgba(255,255,255,.18),transparent 45%),linear-gradient(140deg,#4A1FA0,#7B4FD6 55%,#E58CC6);color:#FFFFFF;cursor:pointer;transition:opacity .6s ease,visibility .6s ease}
.tb-splash.out{opacity:0;visibility:hidden}
.tb-splash .sp-k{font-size:13px;font-weight:700;letter-spacing:5px;text-transform:uppercase;opacity:0;animation:spUp .7s ease .1s forwards}
.tb-splash h1{margin:0;font-size:clamp(34px,9vw,68px);font-weight:800;line-height:1.08;letter-spacing:-1px}
.tb-splash h1 .sp-w{font-style:normal;white-space:nowrap;display:inline-block}
.tb-splash h1 span{display:inline-block;opacity:0;transform:translateY(24px) scale(.9);animation:spLetter .55s cubic-bezier(.2,1.3,.4,1) forwards}
.tb-splash .sp-sub{max-width:520px;font-size:clamp(16px,3.6vw,21px);font-weight:500;line-height:1.45;opacity:0;animation:spUp .8s ease forwards}
.tb-splash .sp-plane{font-size:42px;animation:spFly 2.6s ease-in-out infinite}
.tb-splash .sp-skip{position:absolute;bottom:26px;font-size:12px;font-weight:600;letter-spacing:1px;opacity:.75}
@keyframes spLetter{to{opacity:1;transform:none}}
@keyframes spUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes spFly{0%,100%{transform:translate(-14px,4px) rotate(-6deg)}50%{transform:translate(14px,-6px) rotate(6deg)}}
@media (prefers-reduced-motion: reduce){.tb-splash h1 span,.tb-splash .sp-sub,.tb-splash .sp-k{animation:none;opacity:1;transform:none}.tb-splash .sp-plane{animation:none}}

<script>
(function(){

      all.forEach(function(it){ if(q&&norm(it.t+' '+it.g).indexOf(q)<0) return; if(it.g!==last){ last=it.g; if(it.g) h+='<span class="tb-pickg">'+it.g+'</span>'; }

    box.__close=close;
    function choose(v,name){ close(); if(v!==sel.value){ sel.value=v; sel.dispatchEvent(new Event('change',{bubbles:true})); } label();
      if(v==='__other'&&name){ var form=box.closest('.tb-form')||document, on=form.querySelector('.tb-oname'); if(on){ on.value=name; on.dispatchEvent(new Event('input',{bubbles:true})); setTimeout(function(){ var oc=form.querySelector('.tb-octry'); if(oc) oc.focus(); },50); } } else btn.focus(); }
    btn.addEventListener('click',function(e){ e.preventDefault(); e.stopPropagation(); box.classList.contains('open')?close():open(); });
