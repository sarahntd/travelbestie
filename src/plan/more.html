// city guides: country, sec id, title, intro, must see, eat, stay, getting there
guides:[
 ['japan','tokyo','Tokyo','Huge, safe and spotless: neon districts, shrines and the best convenience stores anywhere. Spring (late Mar to Apr) and autumn are loveliest.','Shibuya Crossing and Shibuya Sky. Senso-ji temple in Asakusa. Meiji Shrine and Harajuku. teamLab Planets. Shinjuku at night and the free view from the Tokyo Metropolitan Government Building.','Sushi, ramen, tempura and depachika food halls. Halal ramen and Muslim-friendly spots around Asakusa and Shinjuku; look for halal-certified signs.','Shinjuku or Shibuya for nightlife and transport. Asakusa or Ueno for a quieter, cheaper base.','Fly to Narita or Haneda (Haneda is closer to the city).'],
 ['japan','kyoto','Kyoto','Japan\'s old capital: thousands of temples, gardens and wooden streets. Go early; it gets very busy.','Fushimi Inari\'s red gates (go at sunrise). Kiyomizu-dera. Arashiyama bamboo grove. Kinkaku-ji, the Golden Pavilion. Gion\'s old streets at dusk.','Nishiki Market, matcha sweets, yudofu tofu and kaiseki dinners. Several halal ramen and curry spots near Kyoto Station.','Near Kyoto Station for trains. Gion or Higashiyama for old-town charm.','Shinkansen from Tokyo in about 2 hours 15 minutes; 30 minutes by train from Osaka.'],
 ['japan','osaka','Osaka','Japan\'s kitchen: street food, castles, theme parks and big-city fun.','Dotonbori\'s neon and the Glico sign. Osaka Castle. Universal Studios Japan. Kuromon Market. Day trip to Nara\'s deer park.','Takoyaki, okonomiyaki and kushikatsu. Ask for no-pork versions; halal takoyaki exists in Namba.','Namba for food and nightlife. Umeda for shopping and trains.','Fly into Kansai Airport; Shinkansen from Tokyo about 2.5 hours.'],
 ['japan','sapporo','Sapporo (Hokkaido)','Snowy winters, flower summers, seafood and great ramen.','Sapporo Snow Festival (early February). Odori Park. Otaru canal town. Shiroi Koibito Park. Jozankei hot springs. Summer flower fields in Furano.','Miso ramen, crab, soup curry and Hokkaido milk ice cream.','Susukino or near Sapporo Station.','Fly from Tokyo in about 1.5 hours to New Chitose Airport.'],
 ['south-korea','seoul','Seoul','Palaces next to skyscrapers, K-pop, cafés and shopping that never stops.','Gyeongbokgung Palace (wear a hanbok and entry is free). Bukchon Hanok Village. N Seoul Tower. Myeongdong street food. Hongdae nightlife. DMZ day tour.','Korean BBQ, bibimbap, tteokbokki and fried chicken. Halal restaurants cluster around the Seoul Central Mosque in Itaewon.','Myeongdong for first-timers. Hongdae for nightlife. Itaewon for halal food.','Fly to Incheon; take the AREX train into the city.'],
 ['south-korea','busan','Busan','Korea\'s seaside city: beaches, hillside villages and fresh seafood.','Gamcheon Culture Village. Haeundae Beach and the Blueline Park sky capsule. Haedong Yonggungsa temple by the sea. Jagalchi Fish Market.','Fresh seafood at Jagalchi, milmyeon cold noodles and ssiat hotteok pancakes.','Haeundae for the beach. Seomyeon for food and transport.','KTX from Seoul in about 2.5 hours.'],
 ['south-korea','jeju','Jeju Island','Volcanic island of green fields, waterfalls, beaches and tangerines.','Seongsan Ilchulbong sunrise peak. Manjanggul lava tube. Hallasan hike. Cheonjiyeon and Jeongbang waterfalls. Hyeopjae Beach.','Black pork (non-halal), seafood, abalone porridge and Jeju tangerines.','Jeju City near the airport, or Seogwipo in the south.','Fly from Seoul in about 1 hour; renting a car is the easiest way around.'],
 ['taiwan','taipei','Taipei','Night markets, temples, hot springs and a very easy metro.','Taipei 101. Longshan Temple. Shilin and Raohe night markets. Elephant Mountain sunset hike. Jiufen and Shifen day trip. Beitou hot springs.','Beef noodle soup, xiaolongbao, bubble tea and scallion pancakes. Halal food near the Taipei Grand Mosque.','Ximending or near Taipei Main Station.','Fly to Taoyuan; Airport MRT into the city in about 40 minutes.'],
 ['taiwan','tainan','Tainan','Taiwan\'s oldest city: temples, old streets and the best snacks.','Anping Old Fort and Tree House. Chihkan Tower. Shennong Street. Confucius Temple.','Danzai noodles, milkfish soup and shrimp rolls.','Near the Central West District for walking.','High Speed Rail from Taipei in about 1 hour 45 minutes.'],
 ['hong-kong','hong-kong','Hong Kong','Skyline views, dim sum and surprisingly green hikes.','Victoria Peak by the Peak Tram. Star Ferry and the Tsim Sha Tsui promenade with the evening light show. Big Buddha and Ngong Ping 360 on Lantau. Dragon\'s Back hike. Temple Street Night Market.','Dim sum, roast meats, egg tarts and milk tea. Halal food around the Kowloon Mosque and Chungking Mansions.','Tsim Sha Tsui for views and value. Central or Wan Chai on the island.','Airport Express to Central in about 25 minutes. Fast ferries to Macau in about 1 hour.'],
 ['cambodia','siem-reap','Siem Reap','Gateway to Angkor, one of the world\'s great temple complexes.','Angkor Wat at sunrise. Bayon\'s stone faces in Angkor Thom. Ta Prohm, the jungle temple. Banteay Srei. Phare circus at night.','Fish amok, lok lak and num banh chok noodles. Halal stalls near the Cham mosques.','Near Pub Street and the old market.','Fly into Siem Reap Angkor International Airport. Buy an Angkor Pass at the official ticket centre or online.'],
 ['cambodia','phnom-penh','Phnom Penh','Riverside capital with royal palaces and moving history.','Royal Palace and Silver Pagoda. National Museum. Tuol Sleng Genocide Museum and the Choeung Ek Killing Fields (sobering; go with time to reflect). Sunset river cruise.','Khmer curry, kuy teav noodle soup and the Central Market.','Riverside or BKK1.','Bus from Siem Reap about 6 hours, or a short flight.'],
 ['laos','luang-prabang','Luang Prabang','A sleepy UNESCO town of temples and saffron-robed monks on the Mekong.','Morning alms-giving (watch quietly from a distance). Wat Xieng Thong. Kuang Si waterfalls. Mount Phousi sunset. Night market.','Khao soi Lao, laap and sticky rice; Mekong river weed snacks.','The old town peninsula.','Fly in, or take the Laos-China railway from Vientiane in about 2 hours.'],
 ['laos','vang-vieng','Vang Vieng','Karst mountains, blue lagoons and river adventures.','Blue Lagoon swimming holes. Tubing or kayaking on the Nam Song River. Hot-air balloon at sunrise. Tham Chang cave. Nam Xay viewpoint.','Lao barbecue, fresh baguettes and riverside cafés.','Along the river for the views.','Laos-China railway: about 1 hour from Vientiane and about 1 hour from Luang Prabang.'],
 ['myanmar','yangon','Yangon','Myanmar\'s biggest city, home of the golden Shwedagon Pagoda.','Shwedagon Pagoda at sunset. Sule Pagoda. Bogyoke Market. Colonial buildings downtown. Circular train ride.','Mohinga fish noodle soup, tea leaf salad and Indian-Muslim biryani downtown.','Downtown near Sule Pagoda.','Check current travel advice first. International flights land at Yangon International Airport.'],
 ['myanmar','bagan','Bagan','Over 2,000 temples spread across a dusty plain.','Sunrise over the temples (balloons fly in the cool season). Ananda Temple. Shwezigon Pagoda. Dhammayangyi Temple. Irrawaddy sunset boat.','Bagan curry spreads and tamarind flakes.','New Bagan or Nyaung-U.','Fly from Yangon in about 1 hour 20 minutes. Check current travel advice first.'],
 ['brunei','bandar-seri-begawan','Bandar Seri Begawan','A calm capital of golden domes and stilt villages.','Sultan Omar Ali Saifuddien Mosque. Jame\' Asr Hassanil Bolkiah Mosque. Kampong Ayer water village. Royal Regalia Museum. Proboscis monkeys by river boat. Ulu Temburong National Park canopy walk.','Ambuyat, nasi katok and the Gadong night market. Everything is halal.','Near the city centre or Gadong.','Fly into Brunei International Airport; about 15 minutes from town.'],
 ['timor-leste','dili','Dili and Atauro','A small, friendly capital with reefs and mountains nearby.','Cristo Rei statue and its beach. Timorese Resistance Archive. Atauro Island snorkelling and diving. Mount Ramelau sunrise trek (from Maubisse).','Grilled fish on the beach, Timorese coffee and Portuguese-style bread.','Along the waterfront in Dili; eco-lodges on Atauro.','Flights from Bali and Darwin.'],
 ['australia','sydney','Sydney','A harbour city of beaches, ferries and coastal walks.','Sydney Opera House and Harbour Bridge. Bondi to Coogee coastal walk. Manly ferry. Taronga Zoo. The Rocks. Blue Mountains day trip.','Fish and chips, brunch cafés and the halal food streets of Auburn and Lakemba.','Circular Quay or Darling Harbour for sights. Bondi for the beach.','Fly into Sydney Airport; train to the city in about 15 minutes.'],
 ['australia','melbourne','Melbourne','Laneway cafés, street art, sport and the Great Ocean Road.','Hosier Lane street art. Queen Victoria Market. Royal Botanic Gardens. St Kilda penguins at dusk. Great Ocean Road and the Twelve Apostles. Phillip Island penguin parade.','Coffee culture, brunch and halal food on Sydney Road in Brunswick.','The CBD, with free trams.','Fly from Sydney in about 1.5 hours.'],
 ['australia','cairns','Cairns','Gateway to the Great Barrier Reef and the Daintree Rainforest.','Great Barrier Reef snorkelling or diving day trip. Daintree Rainforest and Cape Tribulation. Kuranda Scenic Railway and Skyrail. Cairns Esplanade Lagoon.','Fresh seafood, tropical fruit and night markets.','Cairns city or Palm Cove.','Fly from Sydney in about 3 hours.'],
 // more famous cities in countries we already had
 ['malaysia','malacca','Malacca','A UNESCO port town of Peranakan houses, history and river cruises.','Jonker Street night market (weekends). Christ Church and Dutch Square. A Famosa and St Paul\'s Hill. Melaka River cruise. Baba and Nyonya Heritage Museum.','Chicken rice balls, Nyonya laksa and cendol. Plenty of halal choices.','Near Jonker Street or the river.','About 2 hours by bus from Kuala Lumpur.'],
 ['malaysia','langkawi','Langkawi','Duty-free island of beaches, mangroves and a sky bridge.','Langkawi SkyCab and Sky Bridge. Island hopping. Kilim mangrove tour. Pantai Cenang sunset. Seven Wells waterfall.','Seafood by the beach and Malay food everywhere; all easily halal.','Pantai Cenang for the beach.','Fly from KL in about 1 hour, or ferry from Penang.'],
 ['malaysia','kota-kinabalu','Kota Kinabalu (Sabah)','Mount Kinabalu, islands and wildlife in Malaysian Borneo.','Tunku Abdul Rahman islands. Kinabalu Park. Mari Mari Cultural Village. Klias River fireflies and proboscis monkeys. Sunset at the waterfront.','Seafood at the Filipino market, hinava and tuaran mee.','Near the waterfront.','Fly from KL in about 2.5 hours.'],
 ['indonesia','jakarta','Jakarta','Indonesia\'s capital: malls, history and big-city food.','Monas (National Monument). Istiqlal Mosque and Jakarta Cathedral. Kota Tua old town. Thousand Islands day trip. TMII.','Soto Betawi, kerak telor, nasi uduk and endless malls with food courts.','Central Jakarta or near SCBD for transport.','MRT and TransJakarta make getting around easier; traffic is heavy at rush hour.'],
 ['indonesia','bromo','Bromo and Malang (East Java)','Sunrise over a smoking volcano and cool hill towns.','Mount Bromo sunrise from Penanjakan. Sea of Sand by jeep. Madakaripura waterfall. Malang\'s colourful Jodipan village. Batu\'s apple farms.','Bakso Malang, rawon and warm wedang ronde on cold mornings.','Cemoro Lawang for Bromo sunrise, or Malang city.','Train or flight to Malang or Surabaya, then a jeep tour to Bromo.'],
 ['thailand','chiang-mai','Chiang Mai','Old-city temples, mountains, night markets and elephant sanctuaries.','Wat Phra That Doi Suthep. Old City temples. Sunday Walking Street. Ethical elephant sanctuary (no riding). Doi Inthanon.','Khao soi curry noodles, sai oua sausage and northern Thai food. Halal khao soi near the Ban Haw mosque.','Inside the Old City or Nimman.','Fly from Bangkok in about 1 hour 15 minutes, or take the night train.'],
 ['thailand','krabi','Krabi','Limestone cliffs, beaches and island hopping.','Railay Beach. Phi Phi day trip. 4 Islands tour. Tiger Cave Temple. Emerald Pool.','Southern Thai curries and seafood; many halal places, as the area has a large Muslim community.','Ao Nang for convenience.','Fly into Krabi, or about 2.5 hours by road from Phuket.'],
 ['vietnam','hoi-an','Hoi An','A lantern-lit old town by the river.','Ancient Town and the Japanese Covered Bridge. Lantern boat ride at night. An Bang Beach. Tailor shops. My Son ruins.','Cao lau noodles, banh mi and white rose dumplings.','Near the Ancient Town.','About 45 minutes by car from Da Nang.'],
 ['vietnam','ha-long','Ha Long Bay','Thousands of limestone islands rising from emerald water.','Overnight cruise. Kayaking and caves. Lan Ha Bay. Ti Top Island viewpoint.','Seafood on board your cruise.','On a cruise boat, or Bai Chay town.','About 2.5 hours by road from Hanoi.'],
 ['vietnam','phu-quoc','Phu Quoc','Island beaches, sunsets and the world\'s longest sea cable car.','Sao Beach. Hon Thom cable car. Sunset Town. Night market. Snorkelling in the An Thoi islands.','Seafood, fish sauce farms and pepper farms.','Long Beach for sunsets.','Fly from Saigon in about 1 hour.'],
 ['philippines','bohol','Bohol','Chocolate Hills, tarsiers and white beaches.','Chocolate Hills. Tarsier sanctuary. Loboc River cruise. Panglao beaches. Balicasag Island snorkelling.','Seafood and Filipino favourites; halal is limited, so ask.','Panglao Island.','Fast ferry from Cebu in about 2 hours.'],
 ['philippines','siargao','Siargao','Surfing island of palms, lagoons and laid-back cafés.','Cloud 9 surf break. Sugba Lagoon. Island hopping (Naked, Daku, Guyam). Magpupungko rock pools. Coconut road viewpoint.','Fresh seafood and smoothie bowls.','General Luna.','Fly from Manila or Cebu.'],
 ['sri-lanka','colombo','Colombo','The busy, friendly capital: colonial streets, temples and sunsets by the sea.','Gangaramaya Temple. Pettah Market and the red mosque. Galle Face Green at sunset. Colombo Fort and the Old Dutch Hospital. Mount Lavinia Beach.','Rice and curry, kottu roti, hoppers and fresh crab. Halal food is easy to find, especially in Pettah.','Colombo 3 (Kollupitiya) or near Galle Face for first-timers.','Fly into Bandaranaike International Airport; about 45 minutes to the city by expressway.'],
 ['sri-lanka','kandy','Kandy','The cool hill capital, home of the Temple of the Tooth.','Temple of the Tooth. Kandy Lake. Royal Botanical Gardens, Peradeniya. Bahirawakanda Buddha. Kandyan dance show. A tea factory tour.','Rice and curry buffets, Kandyan sweets and Ceylon tea.','Around the lake, or in the hills for the views.','Train or car from Colombo, about 3 hours.'],
 ['sri-lanka','sigiriya','Sigiriya and the Cultural Triangle','Ancient kingdoms in the dry heartland.','Sigiriya Rock Fortress. Pidurangala Rock at sunset. Dambulla Cave Temple. Polonnaruwa ruins by bicycle. Minneriya elephant safari.','Village rice and curry, curd with treacle and king coconut.','Sigiriya or Habarana, near the sights.','About 4 hours by car from Colombo, or 2.5 hours from Kandy.'],
 ['sri-lanka','ella','Ella and the Hill Country','Tea hills, waterfalls and the famous blue train.','Kandy to Ella train. Nine Arch Bridge. Little Adam\'s Peak. Ella Rock. Lipton\'s Seat. Horton Plains and World\'s End.','Rice and curry, roti and fresh hill country tea.','Ella town for cafés, or a tea estate stay.','Scenic train from Kandy (6 to 7 hours) or about 4 hours by car.'],
 ['sri-lanka','galle','Galle and the South Coast','A Dutch fort town and the island\'s best beaches.','Galle Fort ramparts. Unawatuna and Jungle Beach. Mirissa whale watching. Coconut Tree Hill. Stilt fishermen at Koggala. Yala leopard safari.','Fresh seafood, string hoppers and fish curry.','Inside Galle Fort, or Unawatuna and Mirissa for the beach.','About 2 hours from Colombo on the expressway, or by coastal train.'],
],
