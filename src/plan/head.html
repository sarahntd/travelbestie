<style>

.sg-wrap{font-family:Fredoka,sans-serif;color:#3E2A6B;background:#F3EEFF;padding:24px 16px;box-sizing:border-box;border-radius:24px}
.sg-wrap *{box-sizing:border-box}
.sg-head{text-align:center;margin-bottom:22px}
.sg-kicker{font-size:14px;letter-spacing:3px;color:#3E2A6B;font-weight:600}
.sg-head h1{margin:4px 0;font-size:38px;font-weight:700}
.sg-sec{border-radius:24px;padding:18px 20px;margin:0 0 18px;background:#fff}
.sg-sec h2{margin:0 0 4px;font-size:24px}
.sg-sec .sub{font-size:14px;opacity:.75;margin-bottom:12px}
.sg-card{border-radius:18px;padding:14px 16px;margin:0 0 10px;background:#F3EEFF}
.sg-card h3{margin:0 0 4px;font-size:19px;font-weight:700}
.sg-meta{font-size:14px;opacity:.85;line-height:1.5}
.sg-tag{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:10px;margin-right:4px}
.ok{background:#F3EEFF;color:#3E2A6B}
.check{background:#F3EEFF;color:#3E2A6B}

:root{color-scheme:light}
html,body{background:#FFFFFF !important;color:#3E2A6B !important}
.sg-wrap,.sg-wrap *{color:#3E2A6B !important}
.sg-sec{background:#FFFFFF !important;border:2px solid #E4D9FF}
.sg-card{background:#F3EEFF !important}
.sg-wrap .sg-kicker{color:#7B4FD6 !important}
.sg-wrap svg text{fill:#3E2A6B !important}
.sg-wrap svg circle{fill:#7B4FD6 !important}
.sg-wrap svg text[fill="#fff"]{fill:#FFFFFF !important}

.sg-tip{flex:0 0 220px;min-height:110px;border-radius:16px;background:#FFFFFF;border:2px solid #7B4FD6;padding:10px 12px;font-size:14px;line-height:1.45;text-align:left;box-sizing:border-box}

/* motion */
@keyframes sgBounce{0%,100%{transform:translateY(0)}50%{transform:translateY(8px)}}
@keyframes sgFloat{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-6px) rotate(2deg)}}
@keyframes sgTwinkle{0%,100%{opacity:.35;transform:scale(.9)}50%{opacity:1;transform:scale(1.15)}}
.sg-hint{text-align:center;margin:6px 0 22px;font-weight:600;font-size:16px;color:#7B4FD6;transition:opacity .4s}
.sg-hint span{display:inline-block;font-size:26px;line-height:1;animation:sgBounce 1.4s ease-in-out infinite}
.sg-hint.gone{opacity:0}
.sg-deco{position:relative;height:0;overflow:visible}
.sg-deco i{position:absolute;font-style:normal;font-size:20px;color:#7B4FD6;animation:sgTwinkle 2.4s ease-in-out infinite}
.sg-deco i:nth-child(1){left:8%;top:-40px;animation-delay:.4s}
.sg-deco i:nth-child(2){left:88%;top:-28px;animation-delay:1.1s}
.sg-head h1{animation:sgFloat 5s ease-in-out infinite}
.sg-day,.sg-sec{transition:transform .25s ease,box-shadow .25s ease}
.sg-day:hover,.sg-sec:hover{transform:translateY(-3px);box-shadow:0 10px 24px rgba(123,79,214,.18)}
.sg-card{transition:transform .2s ease}
.sg-card:hover{transform:translateX(4px)}
.js .reveal{opacity:0;transform:translateY(26px);transition:opacity .6s ease,transform .6s ease}
.js .reveal.in{opacity:1;transform:none}
.js .reveal.in:hover{transform:translateY(-3px)}
@media (prefers-reduced-motion: reduce){
  .sg-hint span,.sg-head h1,.sg-deco i{animation:none}
  .js .reveal{opacity:1;transform:none;transition:none}
  .sg-day,.sg-sec,.sg-card{transition:none}
}

/* map pins and popup */
.sg-map circle{cursor:pointer;transition:transform .2s ease}
.sg-map circle:hover{transform:scale(1.12);transform-box:fill-box;transform-origin:center}
.sg-map text{pointer-events:none}
.sg-pop{position:fixed;inset:0;background:rgba(62,42,107,.45);display:none;align-items:center;justify-content:center;z-index:9999;padding:16px}
.sg-pop.open{display:flex;animation:sgFade .25s ease}
.sg-pop-box{position:relative;background:#fff;border:3px solid #7B4FD6;border-radius:24px;padding:18px;width:min(640px,100%);max-height:92vh;overflow:auto;color:#3E2A6B;font-family:Fredoka,sans-serif;animation:sgPop .35s cubic-bezier(.2,1.4,.4,1)}
.sg-pop-box h3{margin:0 0 10px;font-size:22px}
.sg-pop-box iframe{width:100%;height:320px;border:0;border-radius:16px;background:#F3EEFF}
.sg-pop-actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:space-between;align-items:center;margin-top:12px}
.sg-pop-x{position:sticky;top:0;float:right;margin:-6px -6px 0 8px;z-index:5;width:48px;height:48px;border-radius:50%;border:3px solid #fff;background:#7B4FD6;color:#fff;font-size:30px;line-height:1;font-weight:700;cursor:pointer;font-family:inherit;box-shadow:0 4px 12px rgba(62,42,107,.35);display:flex;align-items:center;justify-content:center}.sg-pop-x:active{transform:scale(.94)}#sgPopFrame,.sg-pop-box .sg-pop-note{display:none!important}
.sg-pop-links{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.sg-pop-links:empty{display:none}.sg-pop-links a{font-size:14px;padding:8px 14px;border-radius:999px;background:#EFE7FF;color:#3E2A6B;text-decoration:none;font-weight:700;border:2px solid #7B4FD6}.sg-pop-links a:hover{background:#7B4FD6;color:#fff}.sg-pop-btn{display:inline-block;background:#7B4FD6;color:#FFFFFF;padding:9px 16px;border-radius:999px;text-decoration:none;font-weight:700;border:0;cursor:pointer;font-family:inherit;font-size:15px}
.sg-pop-close{background:#F3EEFF;color:#3E2A6B}
.sg-pop-note{font-size:13px;opacity:.8;margin-top:8px}
@keyframes sgFade{from{opacity:0}to{opacity:1}}
@keyframes sgPop{from{transform:scale(.7);opacity:0}to{transform:scale(1);opacity:1}}
@media (prefers-reduced-motion: reduce){.sg-pop.open,.sg-pop-box{animation:none}}

/* design refresh */
.sg-wrap{background:linear-gradient(180deg,#EFE7FF 0%,#FFFFFF 46%,#F6F1FF 100%)!important}
.sg-head{padding:26px 16px 18px;margin-bottom:12px}
.sg-head h1{background:linear-gradient(90deg,#4A1FA0,#7B4FD6,#B79CFF);-webkit-background-clip:text;background-clip:text;color:transparent}
.sg-kicker{display:inline-block;background:#fff;border-radius:999px;padding:6px 16px;box-shadow:0 4px 12px rgba(123,79,214,.18);color:#7B4FD6}
.sg-day{border-radius:28px!important;border:2px solid #fff;box-shadow:0 14px 34px rgba(123,79,214,.16);padding:24px!important;background:linear-gradient(160deg,#F7F2FF,#EFE6FF)!important}
.sg-day h2{font-size:26px;letter-spacing:.2px}
.sg-day h2::before{content:"\2726  ";color:#7B4FD6}
.sg-date{display:inline-block;background:#fff;border-radius:999px;padding:5px 14px;font-size:14px;font-weight:600;color:#7B4FD6;box-shadow:0 2px 6px rgba(123,79,214,.12);margin:4px 0 12px}
.sg-list{line-height:2.1;font-size:16.5px;background:#fff;border-radius:20px;padding:16px 18px;box-shadow:inset 0 0 0 1px #E4D9FF}
.sg-time{display:inline-block;background:linear-gradient(135deg,#7B4FD6,#A88BF0);color:#FFFFFF;padding:1px 10px;border-radius:999px;font-weight:700;font-size:.92em;box-shadow:0 3px 8px rgba(123,79,214,.28);margin-right:4px;letter-spacing:.3px}
.sg-label{display:inline-block;color:#7B4FD6;font-weight:700;margin-right:4px}
.sg-tip{border-radius:20px;background:#fff!important;border:2px dashed #7B4FD6!important;box-shadow:0 6px 16px rgba(123,79,214,.12)}
.sg-map{border-radius:20px;box-shadow:0 8px 20px rgba(123,79,214,.1);margin-top:14px}
.sg-sec{border-radius:28px!important;box-shadow:0 14px 34px rgba(123,79,214,.14)}
.sg-sec h2{font-size:26px}
.sg-card{border-radius:20px!important;box-shadow:0 8px 20px rgba(123,79,214,.12);border:1px solid #EDE5FF}
.sg-tag{border-radius:999px}
.sg-foot{text-align:center;font-size:14px;color:#7B4FD6;margin:10px 0 0}

/* more options icons */
.sg-card h3{display:inline-block;vertical-align:middle;margin:0 0 0 2px}
.sg-ico{display:inline-flex;width:46px;height:46px;border-radius:50%;align-items:center;justify-content:center;font-size:22px;background:linear-gradient(135deg,#F3EEFF,#E4D9FF);box-shadow:0 4px 10px rgba(123,79,214,.22);cursor:pointer;margin-right:10px;vertical-align:middle;transition:transform .2s ease}
.sg-ico:hover,.sg-ico:focus{transform:scale(1.12) rotate(-6deg);outline:none}

/* booking, suggestions and weather */
.sg-book{display:inline-block;background:#7B4FD6;color:#FFFFFF!important;padding:3px 11px;border-radius:999px;text-decoration:none;font-weight:700;font-size:14px;box-shadow:0 3px 8px rgba(123,79,214,.28);margin:2px 0}
.sg-book:hover{background:#5B2FB8}
.sg-pick{display:inline-block;background:#3E2A6B;color:#FFFFFF;padding:2px 10px;border-radius:999px;font-weight:700;font-size:.82em;box-shadow:0 2px 6px rgba(62,42,107,.3)}

/* cute weather box */
.sg-weather{display:flex;align-items:center;gap:12px;background:linear-gradient(135deg,#FFFFFF,#F3EEFF);border:2px solid #E4D9FF;border-radius:999px;padding:8px 18px 8px 10px;margin:14px 0 0;width:max-content;max-width:100%;box-shadow:0 6px 16px rgba(123,79,214,.12)}
.sg-cloud{font-size:34px;line-height:1;display:inline-block;animation:sgCloud 3.2s ease-in-out infinite}
.sg-drops{display:inline-flex;gap:3px;align-items:flex-start;height:22px;overflow:hidden}
.sg-drops i{font-style:normal;font-size:13px;display:inline-block;animation:sgDrop 1.1s ease-in infinite}
.sg-drops i:nth-child(2){animation-delay:.35s}
.sg-drops i:nth-child(3){animation-delay:.7s}
.sg-wx-txt{display:flex;flex-direction:column;line-height:1.2}
.sg-wx-txt b{font-size:16px;color:#3E2A6B}
.sg-wx-txt small{font-size:13px;color:#7B4FD6;font-weight:600}
@keyframes sgCloud{0%,100%{transform:translateX(0)}50%{transform:translateX(5px)}}
@keyframes sgDrop{0%{transform:translateY(-6px);opacity:0}40%{opacity:1}100%{transform:translateY(12px);opacity:0}}
@media (prefers-reduced-motion: reduce){.sg-cloud,.sg-drops i{animation:none}}

/* weather times */
.sg-weather{flex-direction:column;align-items:flex-start;border-radius:24px;gap:10px;padding:12px 16px}
.sg-wx-head{display:flex;align-items:center;gap:10px}
.sg-wx-head b{font-size:16px;color:#3E2A6B}
.sg-wx-head small{font-size:12px;color:#7B4FD6;font-weight:600;background:#F3EEFF;border-radius:999px;padding:2px 8px}
.sg-wx-times{display:flex;flex-wrap:wrap;gap:8px}
.sg-chip{display:inline-block;border-radius:999px;padding:5px 12px;font-size:14px;font-weight:700;color:#3E2A6B;background:#FFFFFF;border:2px solid #E4D9FF}
.sg-chip.wet{background:linear-gradient(135deg,#7B4FD6,#A88BF0);color:#FFFFFF;border-color:transparent;box-shadow:0 3px 8px rgba(123,79,214,.3);animation:sgBounce 2.4s ease-in-out infinite}
.sg-chip.dry{background:#F3EEFF}
.sg-chip.maybe{border-style:dashed}
@media (prefers-reduced-motion: reduce){.sg-chip.wet{animation:none}}

/* opening hours clocks and card style */
.sg-head h1{font-size:clamp(24px,5.2vw,36px);letter-spacing:.5px;line-height:1.2}
.sg-card{position:relative;overflow:hidden;background:linear-gradient(160deg,#FFFFFF,#F9F6FF)!important}
.sg-card::after{content:"";position:absolute;right:-22px;top:-22px;width:70px;height:70px;border-radius:50%;background:radial-gradient(circle,#E4D9FF 0%,transparent 70%);pointer-events:none}
.sg-clock{margin-top:12px;background:#F7F3FF;border:2px dashed #B79CFF;border-radius:16px;padding:10px 12px;position:relative;z-index:1}
.sg-place{font-weight:700;font-size:14px;color:#7B4FD6;margin-bottom:4px}
.sg-hrs{display:flex;align-items:center;flex-wrap:wrap;gap:8px;font-size:15px;color:#3E2A6B}
.sg-day-tag{background:#3E2A6B;color:#FFFFFF;border-radius:999px;padding:1px 9px;font-size:12px;font-weight:700}
.sg-hrs b{background:linear-gradient(135deg,#7B4FD6,#A88BF0);color:#FFFFFF;border-radius:999px;padding:2px 10px;box-shadow:0 3px 8px rgba(123,79,214,.28)}
.sg-arr{display:inline-block;color:#7B4FD6;font-weight:700;animation:sgNudge 1.6s ease-in-out infinite}
.sg-track{position:relative;height:10px;border-radius:999px;background:#E4D9FF;margin-top:10px;overflow:hidden}
.sg-track i{position:absolute;top:0;bottom:0;left:var(--o);width:calc(var(--c) - var(--o));border-radius:999px;background:linear-gradient(90deg,#7B4FD6,#B79CFF);transform-origin:left;animation:sgGrow .9s ease-out both;box-shadow:0 0 8px rgba(123,79,214,.45)}
.sg-closed{display:inline-block;margin-top:8px;font-size:12px;font-weight:700;color:#7B4FD6;background:#FFFFFF;border:1px solid #E4D9FF;border-radius:999px;padding:2px 9px}
@keyframes sgNudge{0%,100%{transform:translateX(0)}50%{transform:translateX(4px)}}
@keyframes sgGrow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@media (prefers-reduced-motion: reduce){.sg-arr,.sg-track i{animation:none}}

/* responsive layout: phones first, then wider screens */
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
.sg-wrap{overflow-x:hidden;max-width:1100px;margin:0 auto}
.sg-map,.sg-pop-box iframe{max-width:100%}
@media (max-width:600px){
  .sg-wrap{padding:14px 10px;border-radius:0}
  .sg-head{padding:16px 6px 10px}

  .sg-day{padding:16px!important;border-radius:22px!important}
  .sg-day h2{font-size:20px}
  .sg-date{font-size:13px}

}

a.sg-ico{text-decoration:none;color:inherit}
svg a{cursor:pointer}

/* keep text readable on purple badges and buttons */
.sg-wrap .sg-pick,.sg-wrap .sg-time,.sg-wrap .sg-book,.sg-wrap a.sg-book,.sg-wrap .sg-chip.wet,.sg-wrap .sg-hrs b,.sg-wrap .sg-day-tag,.sg-wrap a.sg-ico,.sg-wrap a[style*="7B4FD6"],.sg-wrap a[href*="google.com/maps/dir"]{color:#FFFFFF !important}
.sg-wrap .sg-pick{background:#3E2A6B !important}

/* in-popup reviews */
.sg-pop-photo{margin-top:12px;text-align:left}.sg-pop-photo img{display:block;width:100%;height:auto;max-height:240px;object-fit:cover;border-radius:16px;border:2px solid #E9DDFB}.sg-pop-credit{font-size:11px;line-height:1.4;opacity:.8;margin-top:6px}.sg-pop-credit a{color:#7B4FD6}.sg-pop-info{text-align:left;margin-top:12px}

/* tidy schedule rows */
.sg-list{line-height:1.5!important;padding:6px 18px!important}

/* visited checklist and my rating */
.sg-mine{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:8px}
.sg-done{font-family:inherit;font-size:12px;font-weight:700;padding:3px 11px;border-radius:999px;border:2px solid #CDB8FF;background:#FFFFFF;color:#7B4FD6;cursor:pointer;transition:all .2s ease}

/* keyword search */

/* headline motion v2 */
.sg-wrap .sg-hero-main{background-image:linear-gradient(110deg,#4A1FA0 0%,#7B4FD6 18%,#B45FD0 34%,#E07BB8 48%,#EC92C4 54%,#9F7FF0 68%,#7B4FD6 84%,#4A1FA0 100%)!important;background-color:transparent!important;background-size:300% 100%!important;background-repeat:no-repeat;-webkit-background-clip:text!important;background-clip:text!important;animation:sgHeroIn 1s cubic-bezier(.2,1.2,.4,1) both,sgFlow 7s ease-in-out 1s infinite alternate,sgGlow 3.5s ease-in-out 1s infinite!important}
