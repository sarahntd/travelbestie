    if(/\b(book|booking|reserve|reservation|ticket|pesan|tiket)\b/.test(q)) return a('<p>'+(ID?'Kafe, restoran dan bar biasanya tidak perlu dipesan, kecuali yang populer di malam akhir pekan. Untuk tur dan aktivitas, pesan di Klook:':'Cafés, restaurants and bars usually don\'t need booking, except popular ones on weekend nights. For tours and activities, book on Klook:')+'</p>',sel.slice(0,3).map(function(n){ return ['🎟️ '+n,'data-klook',window.tbKlook?window.tbKlook(n+' '+(IT[city]?plain(IT[city].name):'')):'https://www.klook.com']; }));
    if(/\b(add|plan|itinerary|tambah|masukkan|rencana)\b/.test(q)) return a('<p>'+(ID?'Gampang! Buka harimu, tap <b>✨ Atur Hari</b>, lalu pilih tempatnya di <b>Atau pilih ide</b>. Atau ketik namanya di <b>Tambah tempat sendiri</b>.':'Easy! Open your day, tap <b>✨ Adjust Day</b>, then pick the place under <b>Or pick an idea</b>, or type its name under <b>Add your own stop</b>.')+'</p>',IT[city]&&!IT[city].custom?[planBtn(city)]:[]);
    if(/\b(which one|which is|the best|best one|recommend one|favou?rite|paling (bagus|enak|recommended)|mana yang)\b/.test(q)){ var s0=spotOf(items[0],city);
      return a('<p>'+(ID?'Kalau harus pilih satu: ':'If I had to pick one: ')+linkOf(items[0],city)+(s0?' · '+esc(s0[3]):'')+'. '+(ID?'Mau alternatif yang lebih murah atau lebih dekat ke hotelmu?':'Want a cheaper option, or one closer to your hotel?')+'</p>',[[ID?'➕ Lainnya':'➕ Show me more','data-ask',ID?'tunjukkan lainnya':'show me more']]); }
    if(/\b(more|another|others?|else|lainnya|yang lain|lagi)\b/.test(q)){ var all=((window.TB_SPOTS||{})[city]||[]).filter(function(x){ return (!CTX.itemsKind||x[1]===CTX.itemsKind)&&items.indexOf(x[0])<0; }).slice(0,6);
      if(!all.length) return a('<p>'+(ID?'Itu semua yang ada di daftarku untuk saat ini, Bestie. Daftarnya diperbarui setiap minggu 💜':'That\'s everything on my list for now, Bestie. It gets updated every week 💜')+'</p>');
      CTX.items=items.concat(all.map(function(x){ return x[0]; })); saveCtx();
      return a('<p>'+(ID?'Ini pilihan lainnya:':'Here are more:')+'</p><ul>'+all.map(function(x){ return '<li>'+linkOf(x[0],city)+' · '+esc(x[2])+': '+esc(x[3])+'</li>'; }).join('')+'</ul>',[[ID?'🕒 Jam buka?':'🕒 Opening hours?','data-ask',ID?'jam buka tempat-tempat itu?':'what are their opening hours?']]); }
    return null; }
  // remember the list Sarah just showed, so "they" and "the first one" make sense
  function rememberList(html){ var names=[], re=/<li>(?:<a [^>]*>)?<b>([^<]+)<\/b>/g, m; while((m=re.exec(html))) names.push(m[1].replace(/&amp;/g,'&').replace(/&#39;/g,"'"));
    if(names.length){ CTX.items=names; CTX.itemsCity=CTX.city; var s=spotOf(names[0],CTX.city); CTX.itemsKind=s?s[1]:null; saveCtx(); } }
  var YES=/^(yes|yeah|yep|sure|ok|okay|please|yes please|ya|iya|boleh|mau|oke|ok deh|gas)\b/, NO=/^(no|nope|not now|no thanks|nah|gak|nggak|tidak|ga usah|engga)\b/;
  function ask(text){ text=String(text||'').trim(); if(!text) return; add(esc(text),true); inp.value=''; var t=add('Sarah is typing…'); t.classList.add('typing');
    setTimeout(function(){ t.remove(); var r, eff=text;
      try{ var nq=norm(text), fu=null;
        if(CTX.offer&&YES.test(nq)){ var o=CTX.offer; CTX.offer=null; text=o; nq=norm(o); }
        else if(NO.test(nq)&&nq.split(' ').length<=4){ CTX.offer=null; saveCtx(); r=a('<p>'+(ID?'Oke, Bestie! Ada lagi yang bisa kubantu untuk trip-mu? 😊':'No problem, Bestie! Anything else I can help with for your trip? 😊')+'</p>'); }
        if(!r) fu=followUp(text);
        if(r){} else if(fu){ r=fu; } else {
        eff=withCtx(text); var need=(eff===text)?needsInfo(text):null;
        if(need){ CTX.pending={need:need.need,q:text}; saveCtx(); r={html:'<p>'+need.ask+'</p>',acts:need.opts.filter(function(o,i,a){ return a.indexOf(o)===i; }).map(function(o){ return [cap(o),'data-ask',cap(o)]; })}; }
        else { r=answer(eff); remember(eff);
          // still nothing useful while we're mid-conversation: stay on topic instead of refusing
          if(/can only help with|hanya bisa membantu|not sure about that/i.test(r.html)&&placeName()&&/\?|\b(what|how|is|are|can|do|does|where|when|which|apa|gimana|berapa|bisa|ada)\b/.test(nq))
            r=a('<p>'+(ID?'Hmm, aku belum punya info itu untuk '+esc(placeName())+', Bestie. Aku bisa bantu soal tempat makan, kafe, belanja, hiburan malam, aktivitas, cuaca, anggaran, transportasi, atau visa di sana. Mau tanya yang mana?':'Hmm, I don\'t have that for '+esc(placeName())+' yet, Bestie. I can help with food, cafés, shopping, nightlife, activities, weather, budget, getting around or visas there. Which would you like?')+'</p>',[['🍽️ '+(ID?'Makan':'Food'),'data-ask',ID?'makan di mana':'where to eat'],['✨ '+(ID?'Aktivitas':'Activities'),'data-ask',ID?'aktivitas seru':'fun activities'],['🌤️ '+(ID?'Cuaca':'Weather'),'data-ask',ID?'kapan waktu terbaik':'best time to visit']]); } }
        rememberList(r.html);
        // offers Sarah makes at the end of an answer, so a plain "yes" works
        CTX.offer=null;
        if(/show you more|kasih pilihan lain|cheaper option|lebih murah/.test(r.html)) CTX.offer=ID?'tunjukkan lainnya':'show me more'; else if(/fit them into one day|susun jadi rute/.test(r.html)) CTX.offer=ID?'tambahkan ke rencanaku':'how do I add them to my plan?'; else if(/find halal food there|carikan makanan halal/.test(r.html)) CTX.offer=(ID?'makanan halal di ':'halal food in ')+placeName(); saveCtx(); }
      catch(e){ r=a('<p>Oops, I got confused. Try asking another way?</p>'); }
      var el=add(r.html,false,r.acts); if(r.after) try{ r.after(el); }catch(e){} saveChat(); setTimeout(saveChat,5000); }, 450+Math.random()*350); }
  function newChat(){ msgs.innerHTML=''; CTX={}; saveCtx(); try{ localStorage.removeItem('tbChat'); }catch(e){} greeted=false; open(); }
  (function restore(){ try{ var c=JSON.parse(localStorage.getItem('tbChat')||'null'); if(c&&c.html&&Date.now()-c.at<30*864e5){ msgs.innerHTML=c.html; greeted=true; } }catch(e){} })();
  function open(){ box.classList.add('open'); fab.setAttribute('aria-expanded','true'); msgs.scrollTop=msgs.scrollHeight; if(!greeted){ greeted=true; add(ID?'<p>Hai Bestie! 💜 Aku <b>Sarah</b>, pendiri Travel Bestie. Ini asisten otomatisku, jadi jawabannya langsung dari panduan Travel Bestie. Tanyakan soal destinasi, waktu terbaik, makanan, transportasi, anggaran, atau cara memakai situs ini.</p>':'<p>Hi Bestie! 💜 I\'m <b>Sarah</b>, the founder of Travel Bestie. This is my automated helper, so you\'ll get instant answers from our travel guides. Ask me about destinations, the best time to go, food, getting around, budgets, or how to use the site.</p>'); } setTimeout(function(){ inp.focus(); },50); }
  function close(){ box.classList.remove('open'); fab.setAttribute('aria-expanded','false'); }
  fab.addEventListener('click',function(e){ e.stopPropagation(); box.classList.contains('open')?close():open(); });
  box.querySelector('.tb-hx').addEventListener('click',close);
  box.querySelector('.tb-hnew').addEventListener('click',newChat);
  box.querySelector('form').addEventListener('submit',function(e){ e.preventDefault(); ask(inp.value); });
  chips.addEventListener('click',function(e){ var b=e.target.closest('button'); if(b) ask(b.textContent); });
  box.addEventListener('click',function(e){ var qa=e.target.closest('[data-ask]'); if(qa){ e.stopPropagation(); ask(qa.getAttribute('data-ask')); return; } if(e.target.closest('.acts button')) setTimeout(close,150); });
  document.addEventListener('keydown',function(e){ if(e.key==='Escape'&&box.classList.contains('open')) close(); });
  window.tbBestie={ask:ask,answer:answer,open:open};
})();
</script>
