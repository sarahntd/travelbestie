  function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }

  var SITE=[
    [/share|edit with|with (my )?friends|together|bagikan|bareng|teman/, function(){ return a('<p>Open your plan and tap <b>👥 Share with friends</b> (on the Overview, any day page or in My plans).</p><ul><li><b>Edit link:</b> friends can change the plan with you, and everyone sees updates.</li><li><b>View-only link:</b> for people who just follow along.</li><li><b>Send a copy:</b> friends get their own copy to change.</li></ul>',[['👥 Share my plan','data-tripshare','1']]); }],

  function a(html,acts){ return {html:html,acts:acts||[]}; }

  function answer(raw){
    var q=norm(raw); if(!q) return a('<p>Ask me anything about your trip, Bestie 😊</p>');

      return a('<p>Your plan: <b>'+esc((p.legs||[{city:p.city}]).map(function(l){ return plain((IT[l.city]||{name:l.city}).name); }).join(' → '))+'</b>, '+p.days.length+' days from '+esc(p.from)+'.</p>',[['📊 Open Overview','data-tb-over','1']]); }

    // getting from A to B
    if(cities.length>=2&&/\b(from|to|between|get|travel|how far|ke|dari)\b/.test(q)){ var k1=cities[0], k2=cities[1], l=LINKS[k1+'|'+k2]||LINKS[k2+'|'+k1];
      var t=l?l[0]+' '+l[1]+'.':(IT[k1].country===IT[k2].country?'✈️ A domestic flight, train or long-distance bus; compare times and prices.':'✈️ An international flight; check routes, baggage and visa rules.');
      return a('<p><b>'+esc(plain(IT[k1].name))+' → '+esc(plain(IT[k2].name))+':</b> '+esc(t)+'</p><p>Want both in one trip? Add the second city with <b>Make it a multi-city trip</b>; the travel day is added for you.</p>',[planBtn(k1)]); }

    if(/\b(where should|recommend|suggest|best place|which (city|country|destination)|ideas?|rekomendasi|saran|enaknya|kemana|ke mana)\b/.test(q)||(month!=null&&!city&&!country)){
      var mm=month!=null?month:new Date().getMonth(), pool=Object.keys(IT).filter(function(k){ return !IT[k].custom&&(SEASON[k]||'')[mm]==='d'&&(!country||IT[k].country===country); });
      var pick=pool.sort(function(){ return Math.random()-0.5; }).slice(0,6);
      if(!pick.length) return a('<p>I couldn\'t find a dry-season match'+(country?' in '+COUNTRIES[country][0]:'')+' for '+cap(MON[mm])+'. Try another month, or ask about a city.</p>');
      return a('<p>Great picks for <b>'+cap(MON[mm])+'</b>'+(country?' in '+COUNTRIES[country][0]:'')+' (dry, comfortable season):</p><ul>'+pick.map(function(k){ var t=TAG[k]; return '<li><b>'+esc(plain(IT[k].name))+'</b>'+(t?': '+esc(t[0]):'')+'</li>'; }).join('')+'</ul>',pick.slice(0,3).map(planBtn)); }
