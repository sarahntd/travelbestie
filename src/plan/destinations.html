<!-- ================= SINGAPORE ================= -->
<section class="sg-dest" data-dest="singapore" aria-label="Singapore">
<div class="dz-hero">
<div class="dz-flag" aria-hidden="true">&#127480;&#127468;</div>
<div class="dz-k">Destination guide</div>
<h1 class="dz-t">Singapore</h1>
<div class="dz-tag">A garden city of hawker food, skyline views and island fun</div>
<div class="dz-chips"><span>&#128647; Easy MRT everywhere</span><span>&#128177; Singapore dollar (S$)</span><span>&#9928;&#65039; Afternoon storms in Nov to Dec</span></div>
<div class="dz-jump"><a href="#dz-mbay">Marina Bay</a><a href="#dz-sentosa">Sentosa</a><a href="#dz-heritage">Chinatown and Kampong Glam</a><a href="#dz-orchard">Orchard and Little India</a><a href="#dz-east">Changi and the East</a><a href="#dz-sg-rides">Ride apps</a></div>
<button type="button" class="tb-cta" data-plan-city="singapore" style="margin-top:16px">&#10024; Plan your trip to Singapore</button>
</div>

<div class="sg-sec" id="dz-mbay"><h2>Marina Bay</h2><div class="sub">The famous skyline. Go at sunset and stay for the free evening light shows.</div>
<div class="sg-card"><h3>&#127961;&#65039; Must see</h3><div class="sg-meta">Gardens by the Bay: the Supertree Grove is free, and the Garden Rhapsody light show runs in the evening. Merlion Park. The Marina Bay Sands SkyPark. The Spectra light and water show by the bay. Cloud Forest and Flower Dome (paid).</div></div>
<div class="sg-card"><h3>&#127836; Eat</h3><div class="sg-meta">Satay by the Bay and Lau Pa Sat hawker centres. Look for stalls with a halal certificate.</div></div>
</div>

<div class="sg-sec" id="dz-sentosa"><h2>Sentosa</h2><div class="sub">Singapore's island playground. Take the Sentosa Express from VivoCity, or walk the Sentosa Boardwalk.</div>
<div class="sg-card"><h3>&#127906; Must see</h3><div class="sg-meta">Universal Studios Singapore. The aquarium at Resorts World Sentosa. The Skyline Luge. Siloso and Palawan beaches, and the suspension bridge to the southernmost point of continental Asia.</div></div>
<div class="sg-card"><h3>&#128176; Good to know</h3><div class="sg-meta">Beaches and the boardwalk are free. Book theme park tickets online ahead for the best price.</div></div>
</div>

<div class="sg-sec" id="dz-heritage"><h2>Chinatown and Kampong Glam</h2><div class="sub">Old shophouses, temples, mosques and some of the city's best-loved food.</div>
<div class="sg-card"><h3>&#128332; Must see</h3><div class="sg-meta">Buddha Tooth Relic Temple and Sri Mariamman Temple in Chinatown. Sultan Mosque, Haji Lane's murals and boutiques, and Arab Street in Kampong Glam.</div></div>
<div class="sg-card"><h3>&#127836; Eat</h3><div class="sg-meta">Kampong Glam is full of halal food: murtabak, nasi padang and Middle Eastern cafes. Maxwell Food Centre in Chinatown has many stalls, so check each for halal signs.</div></div>
</div>

<div class="sg-sec" id="dz-orchard"><h2>Orchard Road and Little India</h2><div class="sub">Shopping malls and Christmas lights, then colourful streets and spice shops.</div>
<div class="sg-card"><h3>&#128717;&#65039; Must see</h3><div class="sg-meta">Orchard Road's malls, with the Christmas light-up in November and December. In Little India, Tekka Centre, the Sri Veeramakaliamman Temple and Mustafa Centre, which is open 24 hours.</div></div>
<div class="sg-card"><h3>&#127836; Eat</h3><div class="sg-meta">Biryani, roti prata and banana leaf rice in Little India, with plenty of halal choices.</div></div>
</div>

<div class="sg-sec" id="dz-east"><h2>Changi and the East</h2><div class="sub">Close to your stay in Simei: the airport mall, seaside parks and seafood.</div>
<div class="sg-card"><h3>&#127796; Must see</h3><div class="sg-meta">Jewel Changi Airport and the Rain Vortex indoor waterfall, free to visit. Cycling or a picnic at East Coast Park. Changi Point Boardwalk, and the bumboat to Pulau Ubin for a taste of old village life.</div></div>
<div class="sg-card"><h3>&#127836; Eat</h3><div class="sg-meta">East Coast Lagoon Food Village for satay and seafood by the sea. Geylang Serai Market for Malay food.</div></div>
</div>

<div class="sg-sec"><h2>What's on</h2><div class="sub">Mid-November 2026 listings. Check dates and prices before you book, as they change.</div>
<div class="sg-card"><h3>&#127915; Singapore</h3><div class="sg-meta">Singapore Writers Festival, 13 to 22 Nov.<br>Grandparents' Day at the National Museum, 21 Nov.<br>Japanese pop-culture convention at Suntec, 27 to 29 Nov.<br>Christmas Wonderland from 27 Nov.<br><i>Sources: littlestepsasia.com, sethlui.com, skyscanner.co.in</i></div></div>
</div>

<div class="t2c dz-rides" id="dz-sg-rides"><div class="t2h">&#128241; Cheapest ride apps in Singapore</div>
<ul>
<li><b>No single app is always cheapest,</b> so install two or three and compare the final total before booking. Uber doesn't run in Singapore.</li>
<li><b>Ryde:</b> usually the lowest booking fees, often cheapest for short trips. It adds extra fees on foreign cards, so pay cash if you can.</li>
<li><b>TADA:</b> commission-free with steady prices, good outside rush hour.</li>
<li><b>Gojek:</b> often runs promos. <b>Grab:</b> the most cars and the most reliable, but surges at peak times. <b>CDG Zig:</b> metered taxis, handy for the airport.</li>
<li><b>Save more:</b> avoid 8 to 9:30 AM and 6 to 8 PM, and look for first-ride promo codes. The MRT and buses are usually cheapest of all.</li>
</ul></div>
</section>

<!-- ================= MALAYSIA ================= -->
<section class="sg-dest" data-dest="malaysia" aria-label="Malaysia">
<div class="dz-hero">
<div class="dz-flag" aria-hidden="true">&#127474;&#127486;</div>
<div class="dz-k">Destination guide</div>
<h1 class="dz-t">Malaysia</h1>
<div class="dz-tag">City skylines, heritage streets and some of the best food in Asia</div>
<div class="dz-chips"><span>&#9992;&#65039; About 1 hour from Singapore</span><span>&#128177; Ringgit (RM)</span><span>&#127835; Halal food everywhere</span></div>
<div class="dz-jump"><a href="#dz-kl">Kuala Lumpur</a><a href="#dz-penang">Penang</a><a href="#dz-my-rides">Ride apps</a></div>
</div>

<div class="sg-sec" id="dz-kl"><h2>Kuala Lumpur</h2><div class="sub">Malaysia's capital: twin towers, temples, malls and late-night food. Late Nov to Dec: hot, with heavy afternoon showers.</div>
<div class="sg-card"><h3>&#127961;&#65039; Must see</h3><div class="sg-meta">Petronas Twin Towers and KLCC Park (the fountain show is in the evening). Batu Caves and its 272 rainbow steps, best early before the heat. Merdeka Square and Central Market. Thean Hou Temple. Islamic Arts Museum.</div></div>
<div class="sg-card"><h3>&#127836; Eat</h3><div class="sg-meta">Nasi lemak, roti canai and teh tarik at any mamak stall. Kampung Baru for Malay food. Jalan Alor is busy at night but has many non-halal stalls, so look for halal signs.</div></div>
<div class="sg-card"><h3>&#128719;&#65039; Where to stay</h3><div class="sg-meta">KLCC for the towers and parks. Bukit Bintang for shopping and food. Both are on the MRT and monorail.</div></div>
<div class="sg-card"><h3>&#128740;&#65039; Getting there from Singapore</h3><div class="sg-meta">Fly in about 1 hour. Coaches take about 5 to 6 hours, plus the border queue. ETS trains run from Johor Bahru (JB Sentral) to KL Sentral; check the timetable.</div></div>
</div>

<div class="sg-sec" id="dz-penang"><h2>Penang</h2><div class="sub">An island famous for street food and George Town's old shophouses. November is one of the wetter months; it gets drier into December.</div>
<div class="sg-card"><h3>&#127961;&#65039; Must see</h3><div class="sg-meta">George Town's heritage streets (a UNESCO World Heritage Site) and street art around Armenian Street. Clan jetties. Penang Hill by funicular railway. Kek Lok Si temple. Batu Ferringhi beach for sunsets.</div></div>
<div class="sg-card"><h3>&#127836; Eat</h3><div class="sg-meta">Nasi kandar (Line Clear is a famous halal spot), assam laksa, mee goreng mamak and cendol. Char kway teow is often cooked in pork lard, so look for halal stalls.</div></div>
<div class="sg-card"><h3>&#128719;&#65039; Where to stay</h3><div class="sg-meta">George Town for food and walking. Batu Ferringhi for the beach.</div></div>
<div class="sg-card"><h3>&#128740;&#65039; Getting there from Singapore</h3><div class="sg-meta">Fly in about 1 hour 20 minutes. From Kuala Lumpur, take the ETS train to Butterworth, then the ferry across.</div></div>
</div>

<div class="sg-sec"><h2>What's on</h2><div class="sub">Mid-November 2026 listings. Check dates and prices before you book, as they change.</div>
<div class="sg-card"><h3>&#127915; Kuala Lumpur</h3><div class="sg-meta">World Bachata Festival, 26 to 29 Nov, RM150 to RM700.<br>Evanescence at TM National Stadium, 19 and 20 Nov, from RM299.<br>ILHAM Gallery: Chia Wei Hsu exhibition, 22 Nov to 28 Feb 2027.<br>C.N. Liew exhibition at Wisma Kebudayaan Soka Gakkai, 28 Nov to 17 Jan 2027.<br><i>Sources: salsavida.com, grazia.my, artrabbit.com</i></div></div>
</div>

<div class="t2c dz-rides" id="dz-my-rides"><div class="t2h">&#128241; Cheapest ride apps in Malaysia</div>
<ul>
<li><b>No single app is always cheapest,</b> so install two and compare the final total. Uber no longer runs in Malaysia.</li>
<li><b>Grab:</b> the most cars and the most reliable, in every city. Also does food delivery.</li>
<li><b>AirAsia MOVE:</b> often a little cheaper than Grab in Kuala Lumpur and Penang.</li>
<li><b>Maxim</b> and <b>inDrive:</b> usually the lowest fares, but with fewer cars and older vehicles. On inDrive you offer your own price.</li>
<li><b>Save more:</b> in KL, the MRT and LRT are cheap and skip the traffic. Avoid rides at rush hour and in heavy rain, when prices surge.</li>
</ul></div>
</section>

<!-- ================= INDONESIA ================= -->
<section class="sg-dest" data-dest="indonesia" aria-label="Indonesia">
<div class="dz-hero">
<div class="dz-flag" aria-hidden="true">&#127470;&#127465;</div>
<div class="dz-k">Destination guide</div>
<h1 class="dz-t">Indonesia</h1>
<div class="dz-tag">Over 17,000 islands: volcanoes, jungle, reefs and beaches</div>
<div class="dz-chips"><span>&#9992;&#65039; 1.5 to 3 hours from Singapore</span><span>&#128177; Rupiah (Rp)</span><span>&#127783;&#65039; Rainy season from November</span></div>
<div class="dz-jump"><a href="#dz-sumatera">Sumatera</a><a href="#dz-java">Java</a><a href="#dz-kalimantan">Kalimantan</a><a href="#dz-bajo">Labuan Bajo</a><a href="#dz-bali">Bali</a><a href="#dz-lombok">Lombok</a><a href="#dz-raja">Raja Ampat</a><a href="#dz-id-rides">Ride apps</a></div>
</div>

<div class="sg-sec" id="dz-sumatera"><h2>Sumatera</h2><div class="sub">Big lakes, orangutans and rich Minang food. Rainy season, so expect daily showers.</div>
<div class="sg-card"><h3>&#127956;&#65039; Must see</h3><div class="sg-meta">Lake Toba and Samosir Island, the world's largest volcanic lake. Orangutans at Bukit Lawang. Bukittinggi and the Sianok Canyon in West Sumatera.</div></div>
<div class="sg-card"><h3>&#127836; Eat</h3><div class="sg-meta">Nasi Padang and real rendang in West Sumatera. Mie Aceh. Most food is halal; around Lake Toba, check, as some places serve pork.</div></div>
<div class="sg-card"><h3>&#128740;&#65039; Getting there from Singapore</h3><div class="sg-meta">Fly to Medan (Kualanamu) in about 1 hour 30 minutes, then drive about 4 to 5 hours to Lake Toba. For West Sumatera, fly to Padang.</div></div>
</div>

<div class="sg-sec" id="dz-java"><h2>Java</h2><div class="sub">Temples, volcanoes and big cities. Rainy season; volcano sunrises are best in the dry months, so check the forecast.</div>
<div class="sg-card"><h3>&#127963;&#65039; Must see</h3><div class="sg-meta">Borobudur and Prambanan temples near Yogyakarta, plus the Kraton palace and Malioboro Street. Sunrise over Mount Bromo. The blue fire of Ijen Crater. Jakarta's old town, Kota Tua.</div></div>
<div class="sg-card"><h3>&#127836; Eat</h3><div class="sg-meta">Gudeg in Yogyakarta, satay, soto ayam and nasi goreng. Food is mostly halal.</div></div>
<div class="sg-card"><h3>&#128646; Getting around</h3><div class="sg-meta">Trains are comfortable and cheap between cities. The Whoosh high-speed train links Jakarta and Bandung in under an hour.</div></div>
<div class="sg-card"><h3>&#128740;&#65039; Getting there from Singapore</h3><div class="sg-meta">Fly to Jakarta in about 1 hour 50 minutes, or fly to Yogyakarta or Surabaya.</div></div>
</div>

<div class="sg-sec" id="dz-kalimantan"><h2>Kalimantan</h2><div class="sub">Indonesian Borneo: rainforest rivers, wild orangutans and floating markets. Wet and humid all year.</div>
<div class="sg-card"><h3>&#129447; Must see</h3><div class="sg-meta">A 2 to 3 day klotok houseboat trip in Tanjung Puting National Park to see wild orangutans. The Lok Baintan floating market near Banjarmasin at dawn. The Derawan Islands for turtles and snorkelling.</div></div>
<div class="sg-card"><h3>&#127836; Eat</h3><div class="sg-meta">Soto Banjar and fresh river fish. Food is mostly halal.</div></div>
<div class="sg-card"><h3>&#128740;&#65039; Getting there from Singapore</h3><div class="sg-meta">Usually through Jakarta: fly on to Pangkalan Bun for Tanjung Puting, Banjarmasin for the floating market, or Berau for Derawan. Book tours ahead.</div></div>
</div>

<div class="sg-sec" id="dz-bajo"><h2>Labuan Bajo</h2><div class="sub">Gateway to Komodo National Park. Wet season starts around December, and seas can be rougher, so keep a spare day.</div>
<div class="sg-card"><h3>&#129422; Must see</h3><div class="sg-meta">Komodo dragons on Komodo or Rinca Island with a ranger. The Padar Island viewpoint at sunrise. Pink Beach. Snorkelling with manta rays at Manta Point. A 1 to 3 day boat trip around the islands.</div></div>
<div class="sg-card"><h3>&#127836; Eat</h3><div class="sg-meta">Grilled fish at the night market by the harbour. Halal options are easy to find in town.</div></div>
<div class="sg-card"><h3>&#128176; Good to know</h3><div class="sg-meta">National park fees apply and change often, so check the current price before you go.</div></div>
<div class="sg-card"><h3>&#128740;&#65039; Getting there from Singapore</h3><div class="sg-meta">Fly to Bali or Jakarta, then about 1 hour to Labuan Bajo (Komodo Airport).</div></div>
</div>

<div class="sg-sec" id="dz-bali"><h2>Bali</h2><div class="sub">Beaches, rice terraces, temples and cafes. Rainy season: mornings are usually clear, with showers later in the day.</div>
<div class="sg-card"><h3>&#127965;&#65039; Beaches</h3><div class="sg-meta">Double Six (Seminyak), Batu Bolong (Canggu), Padang Padang (Uluwatu), Dream Beach (Lembongan), Gili Trawangan.</div></div>
<div class="sg-card"><h3>&#9749; Cafes</h3><div class="sg-meta">Clear Cafe and Milk &amp; Madu (Canggu), for brunch and laptop time.</div></div>
<div class="sg-card"><h3>&#127860; Restaurants</h3><div class="sg-meta">Locavore (Ubud) and Potato Head Beach Club (Seminyak). Bali is mostly Hindu and pork is common, so look for halal signs or Javanese and Padang warungs.</div></div>
<div class="sg-card"><h3>&#127940; Activities</h3><div class="sg-meta">Mount Batur sunrise trek, Tegallalang rice terraces, Campuhan Ridge Walk, Monkey Forest, Kecak dance at Uluwatu, surf lessons in Canggu, snorkelling at the Gilis or Lembongan.</div></div>
<div class="sg-card"><h3>&#128740;&#65039; Getting there from Singapore</h3><div class="sg-meta">Fly in about 2 hours 40 minutes.</div></div>
</div>

<div class="sg-sec"><h2>Bali in 7 days</h2><div class="sub">A week on the island. Book boats, Mount Batur and Gili tours ahead of time. Opening hours and prices change, so check on the day.</div>
<div class="sg-card"><h3>Day 1: Arrive in Seminyak</h3><div class="sg-meta">Settle in, then watch the sunset at Double Six Beach. Dinner at Potato Head Beach Club.</div></div>
<div class="sg-card"><h3>Day 2: Canggu</h3><div class="sg-meta">Morning surf lesson at Batu Bolong Beach. Brunch at Clear Cafe. Sunset at Echo Beach.</div></div>
<div class="sg-card"><h3>Day 3: Ubud</h3><div class="sg-meta">Walk the Campuhan Ridge, then visit Tegallalang rice terraces and the Monkey Forest. Dinner at Locavore.</div></div>
<div class="sg-card"><h3>Day 4: Kintamani and Mount Batur</h3><div class="sg-meta">Early start for the sunrise trek up Mount Batur with a guide. Breakfast with the volcano view at Kintamani, then the drive back to Ubud.</div></div>
<div class="sg-card"><h3>Day 5: Gili Islands or Nusa Lembongan</h3><div class="sg-meta">Take a fast boat from Sanur or Padangbai. On Gili Trawangan, get around by bicycle, since motorbikes are not allowed. On Lembongan, visit Dream Beach and the mangroves.</div></div>
<div class="sg-card"><h3>Day 6: Uluwatu</h3><div class="sg-meta">Visit Padang Padang or Bingin Beach in the morning. Watch the sunset at Uluwatu Temple, then the Kecak fire dance.</div></div>
<div class="sg-card"><h3>Day 7: Back to Seminyak</h3><div class="sg-meta">Last swim at Seminyak, spa and shopping, then dinner before your flight.</div></div>
</div>

<div class="sg-sec" id="dz-lombok"><h2>Lombok</h2><div class="sub">Bali's quieter neighbour, known as the island of a thousand mosques. Rainy season; Mount Rinjani treks usually close in the wettest months.</div>
<div class="sg-card"><h3>&#127965;&#65039; Must see</h3><div class="sg-meta">The three Gili Islands (Trawangan, Air and Meno). Kuta Mandalika and Tanjung Aan beaches in the south. Sade traditional Sasak village. Waterfalls at Sendang Gile and Tiu Kelep. The Mount Rinjani trek, when open.</div></div>
<div class="sg-card"><h3>&#127836; Eat</h3><div class="sg-meta">Ayam taliwang (spicy grilled chicken) and plecing kangkung. Lombok is mostly Muslim, so halal food is easy to find.</div></div>
<div class="sg-card"><h3>&#128740;&#65039; Getting there from Singapore</h3><div class="sg-meta">Fly through Jakarta or Bali, or take a fast boat from Bali to the Gilis and Lombok, about 2 hours.</div></div>
</div>

<div class="sg-sec" id="dz-raja"><h2>Raja Ampat</h2><div class="sub">Remote islands in West Papua with some of the richest coral reefs on Earth. October to April usually has the calmest seas.</div>
<div class="sg-card"><h3>&#129416; Must see</h3><div class="sg-meta">Snorkelling and diving with manta rays and reef sharks. The Piaynemo viewpoint over the karst islands. Homestays on stilts over the water. Wayag, if you have time and budget, as it is far.</div></div>
<div class="sg-card"><h3>&#128176; Good to know</h3><div class="sg-meta">You need a Raja Ampat visitor permit, paid on arrival. Cash is king, and signal is weak on most islands. Book homestays and boat transfers ahead.</div></div>
<div class="sg-card"><h3>&#128740;&#65039; Getting there from Singapore</h3><div class="sg-meta">Fly to Sorong through Jakarta or Makassar, then take the ferry to Waisai, about 2 hours. Allow a full day each way.</div></div>
</div>

<div class="sg-sec"><h2>What's on</h2><div class="sub">Mid-November 2026 listings. Check dates and prices before you book, as they change.</div>
<div class="sg-card"><h3>&#127915; Bali</h3><div class="sg-meta">Pemuteran Bay Festival in north Bali, 26 to 28 Nov, free entry.<br>CONFEST Bali, 15 Nov, in Ubud.<br>About 24 techno club nights listed for November.<br><i>Sources: indonesia.travel, nowbali.co.id, technoairlines.com</i></div></div>
</div>

<div class="t2c dz-rides" id="dz-id-rides"><div class="t2h">&#128241; Cheapest ride apps in Indonesia</div>
<ul>
<li><b>Gojek</b> and <b>Grab:</b> the two big apps, for cars, motorbike taxis and food. Compare both, as promos change daily.</li>
<li><b>Maxim:</b> often the cheapest, and in many cities, but with fewer and older cars.</li>
<li><b>inDrive:</b> you offer your own price, useful for longer trips.</li>
<li><b>Bluebird (MyBlueBird app):</b> reliable metered taxis, good from airports and at night.</li>
<li><b>Motorbike taxis</b> (GoRide or GrabBike) are the cheapest and fastest way through traffic.</li>
<li><b>Good to know:</b> in parts of Bali, local drivers limit app pickups, so you may need to walk to a pickup point. In Labuan Bajo, Raja Ampat and smaller islands, use hotel transfers and boats instead.</li>
</ul></div>
</section>

<!-- ================= THAILAND ================= -->
<section class="sg-dest" data-dest="thailand" aria-label="Thailand">
<div class="dz-hero">
<div class="dz-flag" aria-hidden="true">&#127481;&#127469;</div>
<div class="dz-k">Destination guide</div>
<h1 class="dz-t">Thailand</h1>
<div class="dz-tag">Temples, night markets and island beaches</div>
<div class="dz-chips"><span>&#9992;&#65039; 1.5 to 2.5 hours from Singapore</span><span>&#128177; Baht (&#3647;)</span><span>&#9728;&#65039; Andaman coast dry season from Nov</span></div>
<div class="dz-jump"><a href="#dz-bkk">Bangkok</a><a href="#dz-phuket">Phuket</a><a href="#dz-samui">Koh Samui</a><a href="#dz-th-rides">Ride apps</a></div>
</div>

<div class="sg-sec" id="dz-bkk"><h2>Bangkok</h2><div class="sub">A huge, busy capital full of temples, markets and street food. Late Nov to Dec is the start of the cooler, drier months.</div>
<div class="sg-card"><h3>&#127983; Must see</h3><div class="sg-meta">The Grand Palace and Wat Phra Kaew (cover shoulders and knees). Wat Pho and its reclining Buddha. Wat Arun across the river. Chatuchak Weekend Market. A Chao Phraya river boat ride. ICONSIAM and Jodd Fairs night market.</div></div>
<div class="sg-card"><h3>&#127836; Eat</h3><div class="sg-meta">Pad thai, tom yum, mango sticky rice and boat noodles. For halal food, try the area around Sukhumvit Soi 3/1 (known as the Arab Quarter) or near Haroon Mosque in Bang Rak. Look for the green Thai halal sign.</div></div>
<div class="sg-card"><h3>&#128719;&#65039; Where to stay</h3><div class="sg-meta">Sukhumvit, near a BTS Skytrain station, for easy transport. Riverside for views and the old town.</div></div>
<div class="sg-card"><h3>&#128740;&#65039; Getting there from Singapore</h3><div class="sg-meta">Fly to Suvarnabhumi or Don Mueang in about 2 hours 25 minutes. The Airport Rail Link runs from Suvarnabhumi into the city.</div></div>
</div>

<div class="sg-sec" id="dz-phuket"><h2>Phuket</h2><div class="sub">Thailand's biggest island, on the Andaman Sea. Late November is the start of the dry, sunny season.</div>
<div class="sg-card"><h3>&#127965;&#65039; Must see</h3><div class="sg-meta">Old Phuket Town's colourful shophouses and the Sunday walking street market. The Big Buddha viewpoint. Day trips to the Phi Phi Islands and Phang Nga Bay (James Bond Island). Kata and Karon beaches.</div></div>
<div class="sg-card"><h3>&#127836; Eat</h3><div class="sg-meta">Seafood, massaman curry and Phuket-style noodles. Phuket has a large Muslim community, so halal food is easy to find.</div></div>
<div class="sg-card"><h3>&#128719;&#65039; Where to stay</h3><div class="sg-meta">Kata or Karon for calmer beaches. Patong for nightlife. Old Town for food and culture.</div></div>
<div class="sg-card"><h3>&#128740;&#65039; Getting there from Singapore</h3><div class="sg-meta">Fly in about 1 hour 35 minutes.</div></div>
</div>

<div class="sg-sec" id="dz-samui"><h2>Koh Samui</h2><div class="sub">A relaxed island in the Gulf of Thailand. Heads-up: November is its rainiest month, and December can still be wet.</div>
<div class="sg-card"><h3>&#127965;&#65039; Must see</h3><div class="sg-meta">Chaweng and Lamai beaches. The Big Buddha temple (Wat Phra Yai). Fisherman's Village in Bophut and its Friday night market. A boat trip to Ang Thong Marine Park, when seas are calm.</div></div>
<div class="sg-card"><h3>&#127836; Eat</h3><div class="sg-meta">Beachfront seafood and Thai curries. There are a few halal restaurants around Chaweng and in the Muslim fishing village at Hua Thanon.</div></div>
<div class="sg-card"><h3>&#128740;&#65039; Getting there from Singapore</h3><div class="sg-meta">Direct flights take about 1 hour 50 minutes. Or fly to Surat Thani and take the ferry, which is cheaper but slower.</div></div>
</div>

<div class="sg-sec"><h2>What's on</h2><div class="sub">Mid-November 2026 listings. Check dates and prices before you book, as they change.</div>
<div class="sg-card"><h3>&#127915; Bangkok and nationwide</h3><div class="sg-meta">Loy Krathong, 24 Nov, nationwide. Bangkok events run 17 to 29 Nov at five sites.<br>Vijit Chao Phraya Light Festival, 9 Nov to 23 Dec.<br>Bangkok Art Biennale, 29 Oct to 28 Feb 2027.<br>Surin Elephant Round-Up: sources disagree on dates (19 to 21 Nov or 22 to 27 Nov), so check.<br><i>Sources: thaiger.com, nationthailand.com, accidentaltravelwriter.com, thaiholidayguide.com</i></div></div>
</div>

<div class="t2c dz-rides" id="dz-th-rides"><div class="t2h">&#128241; Cheapest ride apps in Thailand</div>
<ul>
<li><b>Bolt:</b> often the cheapest in Bangkok, Phuket and Pattaya, but with fewer cars at busy times.</li>
<li><b>Grab:</b> the most cars and the most reliable, but usually pricier. Good for airport runs.</li>
<li><b>inDrive</b> and <b>LINE MAN:</b> worth comparing in Bangkok.</li>
<li><b>Save more in Bangkok:</b> the BTS Skytrain and MRT beat the traffic. Metered taxis are cheap if the driver uses the meter; if not, take another.</li>
<li><b>Islands:</b> Phuket and Koh Samui have fewer app cars and higher prices. Agree on the taxi fare before you get in.</li>
</ul></div>
</section>

<!-- ================= VIETNAM ================= -->
<section class="sg-dest" data-dest="vietnam" aria-label="Vietnam">
<div class="dz-hero">
<div class="dz-flag" aria-hidden="true">&#127483;&#127475;</div>
<div class="dz-k">Destination guide</div>
<h1 class="dz-t">Vietnam</h1>
<div class="dz-tag">From buzzing Saigon to Hanoi's old quarter and the central coast</div>
<div class="dz-chips"><span>&#9992;&#65039; 2 to 3.5 hours from Singapore</span><span>&#128177; Dong (&#8363;)</span><span>&#127777;&#65039; Weather differs north to south</span></div>
<div class="dz-jump"><a href="#dz-saigon">Saigon</a><a href="#dz-danang">Da Nang</a><a href="#dz-hanoi">Hanoi</a><a href="#dz-vn-food">Food to try</a><a href="#dz-vn-rides">Ride apps</a></div>
</div>

<div class="sg-sec" id="dz-saigon"><h2>Saigon (Ho Chi Minh City)</h2><div class="sub">Vietnam's biggest, busiest city. Late November is the end of the rainy season; December is dry and sunny.</div>
<div class="sg-card"><h3>&#127961;&#65039; Must see</h3><div class="sg-meta">Ben Thanh Market. The War Remnants Museum. The Central Post Office and Notre-Dame Cathedral. Nguyen Hue walking street at night. Day trips to the Cu Chi Tunnels and the Mekong Delta.</div></div>
<div class="sg-card"><h3>&#127836; Eat</h3><div class="sg-meta">Pho, banh mi and com tam (broken rice). For halal food, head to the streets around Saigon Central Mosque on Dong Du Street in District 1, which has Malay and Indian restaurants.</div></div>
<div class="sg-card"><h3>&#128719;&#65039; Where to stay</h3><div class="sg-meta">District 1 for sights and food, all within walking distance.</div></div>
<div class="sg-card"><h3>&#128740;&#65039; Getting there from Singapore</h3><div class="sg-meta">Fly to Tan Son Nhat in about 2 hours.</div></div>
</div>

<div class="sg-sec" id="dz-danang"><h2>Da Nang</h2><div class="sub">A beach city on the central coast, close to Hoi An. Heads-up: October to December is the rainy, typhoon-prone season here, so keep plans flexible.</div>
<div class="sg-card"><h3>&#127965;&#65039; Must see</h3><div class="sg-meta">My Khe Beach. The Marble Mountains. Ba Na Hills and the Golden Bridge held up by giant stone hands. The Dragon Bridge, which breathes fire on weekend nights. The lantern-lit old town of Hoi An, about 45 minutes away.</div></div>
<div class="sg-card"><h3>&#127836; Eat</h3><div class="sg-meta">Mi Quang noodles, banh xeo and very fresh seafood. Halal options are limited, so seafood and vegetarian dishes are the easiest choice.</div></div>
<div class="sg-card"><h3>&#128740;&#65039; Getting there from Singapore</h3><div class="sg-meta">Direct flights take about 2 hours 40 minutes.</div></div>
</div>

<div class="sg-sec" id="dz-hanoi"><h2>Hanoi</h2><div class="sub">The capital in the north: old streets, lakes and French-era buildings. Late Nov to Dec is cool and dry, around 17 to 23&deg;C, so bring a light jacket.</div>
<div class="sg-card"><h3>&#127983; Must see</h3><div class="sg-meta">The Old Quarter and Hoan Kiem Lake. The Temple of Literature. A water puppet show. An overnight cruise in Ha Long Bay. Ninh Binh's rivers and limestone peaks.</div></div>
<div class="sg-card"><h3>&#127836; Eat</h3><div class="sg-meta">Pho, bun cha and egg coffee. There are a few halal restaurants in the Old Quarter, near Hanoi's mosque on Hang Luoc Street.</div></div>
<div class="sg-card"><h3>&#128719;&#65039; Where to stay</h3><div class="sg-meta">The Old Quarter or near Hoan Kiem Lake, so you can walk everywhere.</div></div>
<div class="sg-card"><h3>&#128740;&#65039; Getting there from Singapore</h3><div class="sg-meta">Fly to Noi Bai in about 3 hours 20 minutes.</div></div>
</div>

<div class="sg-sec"><h2>What's on</h2><div class="sub">Mid-November 2026 listings. Check dates and prices before you book, as they change.</div>
<div class="sg-card"><h3>&#127915; Hanoi and Saigon</h3><div class="sg-meta">European Music Festival in Hanoi and HCMC, 18 Nov to 3 Dec.<br>Da Lat Flower Festival from 1 Dec.<br>Ok Om Bok moon festival in the Mekong Delta, in November (check the date).<br><i>Sources: en.vietnamplus.vn, vietnam.travel, vietnamparadisetravel.com</i></div></div>
</div>

<div class="sg-sec" id="dz-vn-food"><h2>Food to try</h2><div class="sub">Local favourites to look out for in Saigon and Hanoi.</div>
<div class="sg-card"><h3>&#127836; Pho</h3><div class="sg-meta">Noodle soup with beef or chicken. In Hanoi, try Pho 10 Ly Quoc Su. Beef pho (pho bo) is the classic; chicken (pho ga) is a good pork-free choice.</div></div>
<div class="sg-card"><h3>&#129366; Banh mi</h3><div class="sg-meta">Crusty baguette sandwiches. Many fillings use pork, so ask for chicken, egg or beef.</div></div>
<div class="sg-card"><h3>&#127847; Che</h3><div class="sg-meta">Sweet dessert soups and drinks with beans, jelly, fruit and coconut milk.</div></div>
<div class="sg-card"><h3>&#127820; Banana sticky rice</h3><div class="sg-meta">Banana wrapped in sticky rice and grilled in a leaf, often served with coconut sauce.</div></div>
<div class="sg-card"><h3>&#129408; Cua rang muoi tieu</h3><div class="sg-meta">Crab roasted with salt and pepper, a favourite at seafood restaurants.</div></div>
<div class="sg-card"><h3>&#9749; Egg coffee and kem caramen</h3><div class="sg-meta">Hanoi's whipped egg coffee (Cafe Giang is the original) and Vietnamese creme caramel.</div></div>
</div>

<div class="t2c dz-rides" id="dz-vn-rides"><div class="t2h">&#128241; Cheapest ride apps in Vietnam</div>
<ul>
<li><b>Grab:</b> the most widely used, in every big city, for cars and motorbike taxis.</li>
<li><b>Be:</b> a Vietnamese app that is often cheaper than Grab.</li>
<li><b>Xanh SM:</b> electric VinFast taxis and bikes with fixed, upfront prices. Very popular and good value.</li>
<li><b>Motorbike taxis</b> (GrabBike, beBike, Xanh SM Bike) are the cheapest way to get around.</li>
<li><b>Good to know:</b> Gojek left Vietnam in 2024 and Uber doesn't run there, so ignore old guides that mention them.</li>
</ul></div>
</section>

<!-- ================= CHINA ================= -->
<section class="sg-dest" data-dest="china" aria-label="China">
<div class="dz-hero">
<div class="dz-flag" aria-hidden="true">&#127464;&#127475;</div>
<div class="dz-k">Destination guide</div>
<h1 class="dz-t">China</h1>
<div class="dz-tag">Imperial palaces, the Great Wall, pandas and some of the world's best food</div>
<div class="dz-chips"><span>&#9992;&#65039; 4 to 6 hours from Singapore</span><span>&#128177; Yuan (&#165; CNY)</span><span>&#128241; Set up Alipay before you go</span></div>
<div class="dz-jump"><a href="#dz-cn-know">Good to know</a><a href="#dz-beijing">Beijing</a><a href="#dz-shanghai">Shanghai</a><a href="#dz-xian">Xi'an</a><a href="#dz-chengdu">Chengdu</a><a href="#dz-cn-rides">Ride apps</a></div>
</div>

<div class="sg-sec" id="dz-cn-know"><h2>Good to know before you go</h2><div class="sub">China works differently from the rest of the region, so set these up before you fly.</div>
<div class="sg-card"><h3>&#128179; Paying</h3><div class="sg-meta">Almost everything is paid by phone. Install Alipay or WeChat Pay and link your foreign card before you travel. Carry a little cash as a backup.</div></div>
<div class="sg-card"><h3>&#127760; Internet and apps</h3><div class="sg-meta">Google (including Maps), Instagram and WhatsApp are blocked on Chinese networks. A roaming eSIM from home usually still works. Use Amap or Apple Maps for directions.</div></div>
<div class="sg-card"><h3>&#128706; Visa and passport</h3><div class="sg-meta">Visa rules depend on your passport; several countries get visa-free or transit-free stays, so check the latest rules before booking. Carry your passport every day: trains, hotels and many sights scan it.</div></div>
<div class="sg-card"><h3>&#129385; Halal food</h3><div class="sg-meta">Look for the green &#28165;&#30495; (qingzhen) sign: Hui Muslim restaurants are found in every city, and Xi'an's Muslim Quarter is famous for them.</div></div>
</div>

<div class="sg-sec" id="dz-beijing"><h2>Beijing</h2><div class="sub">The capital: the Forbidden City, the Great Wall and old hutong lanes. Best in spring and autumn.</div>
<div class="sg-card"><h3>&#127983; Must see</h3><div class="sg-meta">The Forbidden City (closed Mondays), Tiananmen Square, the Temple of Heaven, the Summer Palace, and the Great Wall at Mutianyu.</div></div>
<div class="sg-card"><h3>&#127836; Eat</h3><div class="sg-meta">Peking duck, jianbing pancakes and dumplings. For halal food, head to Niujie around Beijing's oldest mosque.</div></div>
<div class="sg-card"><h3>&#128740;&#65039; Getting there from Singapore</h3><div class="sg-meta">Direct flights take about 6 hours.</div></div>
</div>

<div class="sg-sec" id="dz-shanghai"><h2>Shanghai</h2><div class="sub">A glittering skyline, colonial streets and water towns nearby. Best in spring and autumn.</div>
<div class="sg-card"><h3>&#127961;&#65039; Must see</h3><div class="sg-meta">The Bund at night, Yu Garden, the Shanghai Tower, the former French Concession, and the Zhujiajiao water town.</div></div>
<div class="sg-card"><h3>&#127836; Eat</h3><div class="sg-meta">Xiaolongbao soup dumplings and shengjian buns (both usually pork), noodles and seafood. Halal lanzhou noodle shops are everywhere.</div></div>
<div class="sg-card"><h3>&#128740;&#65039; Getting there from Singapore</h3><div class="sg-meta">Direct flights take about 5 hours 30 minutes. Beijing to Shanghai is about 4.5 hours by high-speed train.</div></div>
</div>

<div class="sg-sec" id="dz-xian"><h2>Xi'an</h2><div class="sub">The ancient capital: the Terracotta Army, city walls and the Muslim Quarter.</div>
<div class="sg-card"><h3>&#127983; Must see</h3><div class="sg-meta">The Terracotta Army, cycling the City Wall, the Great Mosque, the Giant Wild Goose Pagoda, and Mount Hua by high-speed train.</div></div>
<div class="sg-card"><h3>&#127836; Eat</h3><div class="sg-meta">The Muslim Quarter is all halal: roujiamo, biangbiang noodles and yangrou paomo lamb soup.</div></div>
<div class="sg-card"><h3>&#128740;&#65039; Getting there</h3><div class="sg-meta">Fly from Singapore (some routes stop on the way), or take the high-speed train from Beijing in about 4.5 to 6 hours.</div></div>
</div>

<div class="sg-sec" id="dz-chengdu"><h2>Chengdu</h2><div class="sub">Laid-back Sichuan capital: giant pandas, teahouses and fiery food.</div>
<div class="sg-card"><h3>&#128060; Must see</h3><div class="sg-meta">The Giant Panda Base (go early), Wenshu Monastery, People's Park teahouses, a Sichuan opera face-changing show, and the Leshan Giant Buddha.</div></div>
<div class="sg-card"><h3>&#127836; Eat</h3><div class="sg-meta">Hot pot, mapo tofu and dan dan noodles. Ask for 'wei la' for mild; halal hot pot restaurants exist.</div></div>
<div class="sg-card"><h3>&#128740;&#65039; Getting there from Singapore</h3><div class="sg-meta">Direct flights take about 4 hours 30 minutes.</div></div>
</div>

<div class="t2c dz-rides" id="dz-cn-rides"><div class="t2h">&#128241; Cheapest ride apps in China</div>
<ul>
<li><b>DiDi:</b> the main ride app, with an English version; pay through Alipay or a linked card.</li>
<li><b>Alipay and Amap:</b> both can book DiDi and other taxis inside the app, without installing anything else.</li>
<li><b>Metro:</b> fast, cheap and signed in English in big cities; scan your Alipay or WeChat QR code at the gates.</li>
<li><b>Taxis:</b> metered and cheap; show the address in Chinese characters.</li>
<li><b>Good to know:</b> Grab, Uber and Gojek don't work in China.</li>
</ul></div>
</section>

<!-- ================= PHILIPPINES ================= -->
<section class="sg-dest" data-dest="philippines" aria-label="Philippines">
<div class="dz-hero">
<div class="dz-flag" aria-hidden="true">&#127477;&#127469;</div>
<div class="dz-k">Destination guide</div>
<h1 class="dz-t">Philippines</h1>
<div class="dz-tag">Over 7,000 islands of lagoons, white beaches and warm welcomes</div>
<div class="dz-chips"><span>&#9992;&#65039; About 3.5 hours from Singapore</span><span>&#128177; Peso (&#8369; PHP)</span><span>&#9728;&#65039; Dry season December to May</span></div>
<div class="dz-jump"><a href="#dz-manila">Manila</a><a href="#dz-cebu">Cebu</a><a href="#dz-elnido">El Nido</a><a href="#dz-boracay">Boracay</a><a href="#dz-ph-rides">Ride apps</a></div>
</div>

<div class="sg-sec" id="dz-manila"><h2>Manila</h2><div class="sub">The busy capital: Spanish-era Intramuros, museums and Manila Bay sunsets.</div>
<div class="sg-card"><h3>&#127984; Must see</h3><div class="sg-meta">Intramuros and Fort Santiago, San Agustin Church, the free National Museum, Binondo Chinatown, and the sunset over Manila Bay.</div></div>
<div class="sg-card"><h3>&#127836; Eat</h3><div class="sg-meta">Adobo, sinigang and halo-halo. Pork is very common; halal food is easiest around the Golden Mosque in Quiapo.</div></div>
<div class="sg-card"><h3>&#128740;&#65039; Getting there from Singapore</h3><div class="sg-meta">Fly to Manila (NAIA) in about 3 hours 30 minutes.</div></div>
</div>

<div class="sg-sec" id="dz-cebu"><h2>Cebu</h2><div class="sub">Island hopping, sardine runs, waterfalls, and Bohol's Chocolate Hills a ferry away.</div>
<div class="sg-card"><h3>&#127965;&#65039; Must see</h3><div class="sg-meta">Historic Cebu City, the Moalboal sardine run, Kawasan Falls canyoneering, Mactan island hopping, and a Bohol day trip.</div></div>
<div class="sg-card"><h3>&#127836; Eat</h3><div class="sg-meta">Cebu lechon (roast pork) is famous; for pork-free choices, go for grilled seafood.</div></div>
<div class="sg-card"><h3>&#128740;&#65039; Getting there from Singapore</h3><div class="sg-meta">Direct flights to Mactan-Cebu take about 3 hours 30 minutes.</div></div>
</div>

<div class="sg-sec" id="dz-elnido"><h2>El Nido</h2><div class="sub">Limestone cliffs and lagoons in northern Palawan. Best from December to May.</div>
<div class="sg-card"><h3>&#128676; Must see</h3><div class="sg-meta">Island hopping Tours A to D: Big Lagoon, Small Lagoon, Secret Lagoon and Hidden Beach. Nacpan Beach and Las Cabanas sunsets.</div></div>
<div class="sg-card"><h3>&#128176; Good to know</h3><div class="sg-meta">Pay the eco-tourism fee on arrival and keep the ticket. Cash is handy; ATMs can run out.</div></div>
<div class="sg-card"><h3>&#128740;&#65039; Getting there from Singapore</h3><div class="sg-meta">Fly via Manila to El Nido, or to Puerto Princesa and drive about 5 to 6 hours.</div></div>
</div>

<div class="sg-sec" id="dz-boracay"><h2>Boracay</h2><div class="sub">Powder-white sand, sunset sailing and island hopping.</div>
<div class="sg-card"><h3>&#127965;&#65039; Must see</h3><div class="sg-meta">White Beach Stations 1 to 3, a paraw sunset sail, Puka Shell Beach, Crystal Cove, and Mount Luho viewpoint.</div></div>
<div class="sg-card"><h3>&#128176; Good to know</h3><div class="sg-meta">Book a government-accredited hotel; it is checked at the port. Environmental and terminal fees are paid on arrival.</div></div>
<div class="sg-card"><h3>&#128740;&#65039; Getting there from Singapore</h3><div class="sg-meta">Fly via Manila or Cebu to Caticlan (or Kalibo), then a short boat ride.</div></div>
</div>

<div class="t2c dz-rides" id="dz-ph-rides"><div class="t2h">&#128241; Cheapest ride apps in the Philippines</div>
<ul>
<li><b>Grab:</b> the main ride app in Manila and Cebu; prices surge in rush hour and rain.</li>
<li><b>Angkas</b> and <b>JoyRide:</b> motorbike taxis, the cheapest and fastest way through Manila traffic.</li>
<li><b>inDrive:</b> you offer your own price; worth comparing in Manila.</li>
<li><b>Islands:</b> there's no Grab on Boracay or in El Nido. Use tricycles and e-trikes, and agree the fare first.</li>
</ul></div>
</section>

    if(key==='home'){
      wrap.classList.remove('sg-destmode');
      if(!fromHash){ tabs.querySelectorAll('button').forEach(function(b){ b.classList.toggle('on',b===home); }); if(location.hash!=='#home') location.hash='#home'; }
      hb.classList.add('pg-on');
    } else {
      wrap.classList.add('sg-destmode');
      holder.querySelectorAll('.sg-dest').forEach(function(s){ s.classList.toggle('on',s.getAttribute('data-dest')===key); });
      var h=key==='plan'?'#plan-'+(planPage.querySelector('#tbCity')||{}).value:key==='myday'?'#myday-'+curDay:key==='overview'?'#myoverview':key==='results'?'#myresults':'#dest-'+key;
      if(!fromHash&&location.hash!==h) location.hash=h;
    }
    markTabs();
    window.scrollTo({top:Math.max(0,wrap.getBoundingClientRect().top+window.scrollY-6),behavior:fromHash?'auto':'smooth'});
  }

  // ---- Home ▾ menu ----
  function item(d){ return '<button type="button" role="menuitem" data-dest-go="'+d[0]+'"><span class="fl">'+d[1]+'</span><span class="tx"><b>'+d[2]+'</b><em>'+d[3]+'</em></span></button>'; }
  var menu=document.createElement('div'); menu.className='sg-hmenu'; menu.setAttribute('role','menu');
  menu.innerHTML=item(HOME)+'<small class="h">Countries</small>'+D.map(item).join('');
  document.body.appendChild(menu);
  var raf=0;
  function place(){ var r=home.getBoundingClientRect(), w=menu.offsetWidth||260; menu.style.top=(r.bottom+8)+'px'; menu.style.left=Math.max(8,Math.min(r.left,window.innerWidth-w-8))+'px'; }
  function follow(){ if(!menu.classList.contains('open')){ raf=0; return; } place(); raf=requestAnimationFrame(follow); }
  function open(){ menu.querySelectorAll('button').forEach(function(b){ b.classList.toggle('on',b.getAttribute('data-dest-go')===cur); }); menu.classList.add('open'); home.setAttribute('aria-expanded','true'); if(!raf) follow(); }
  function close(){ menu.classList.remove('open'); home.setAttribute('aria-expanded','false'); }

  // ---- Customise with Claude (only inside Claude) ----
  function customise(){
    var box=dayPage.querySelector('.tb-ai'), ta=box.querySelector('textarea'), msg=box.querySelector('.tb-msg'), btn=box.querySelector('[data-tb-aigo]');
    var fb=ta.value.trim(); if(!fb){ msg.textContent='Write what you would like to change.'; return; }
    var c=IT[plan.city]; btn.disabled=true; msg.style.color='#7B4FD6'; msg.textContent='Updating your plan…';
    window.claude.use('sample').then(function(s){
      if(!s) throw {code:'unavailable'};
      var p='You are a friendly, knowledgeable '+c.name+' travel planner. Adjust this '+plan.days.length+'-day trip plan for '+c.name+' ('+plan.from+' to '+plan.to+') for '+pplOf(plan)+', getting around by '+modeOf(plan.mode)[2]+(plan.budget?', budget '+CURS[plan.cur]+plan.budget+' per person':'')+'. The traveller prefers halal or pork-free food.'+(plan.goals?' Their trip goals: "'+plan.goals+'".':'')+'\n\nCURRENT PLAN (JSON):\n'+JSON.stringify(plan.days)+'\n\nFEEDBACK: "'+fb+'"\n\nKeep the good parts, change what is asked, use only real, well-known places, realistic times. Return ONLY JSON: {"reply":"one friendly sentence","days":[{"t":"short day title","i":[["9:00 AM","Exact place name","short note, max 15 words"]],"tip":"one tip"}]} with exactly '+plan.days.length+' days.';
      return s.json(p,{modelTier:'default'});
    }).then(function(r){
      if(!r||!r.days||!r.days.length) throw {code:'empty'};
      plan.days=r.days.slice(0,plan.days.length).map(function(d,i){ return {t:d.t||plan.days[i].t,i:(d.i&&d.i.length?d.i:plan.days[i].i).map(function(x){ return [String(x[0]||''),String(x[1]||''),String(x[2]||'')]; }),tip:d.tip||''}; });
      savePlans(); renderAll(); renderDayPage(curDay);
      var nb=dayPage.querySelector('.tb-ai'); nb.classList.add('open'); var nm=nb.querySelector('.tb-msg'); nm.style.color='#1F6B3A'; nm.textContent=r.reply||'Done!';
    }).catch(function(e){ msg.style.color='#B0407F'; msg.textContent=(e&&(e.code==='unavailable'||e.code==='not_granted'))?'This needs you to be signed in to Claude.':'Could not update right now. Please try again.'; btn.disabled=false; });
  }

  // ---- clicks (window capture runs before the trip's own handlers) ----
  window.addEventListener('click',function(e){
    var t=e.target; if(!t.closest) return;
    var x;
    if((x=t.closest('[data-plan-edit]'))){ e.preventDefault(); e.stopPropagation(); var pe=byId(x.getAttribute('data-plan-edit')); if(pe){ editing=pe.id; go('plan',pe.city); } return; }
    if((x=t.closest('[data-tb-open]'))){ e.preventDefault(); e.stopPropagation(); var po=byId(x.getAttribute('data-tb-open')); if(po){ plan=po; savePlans(); active='custom'; ls('tbActive','custom'); renderAll(); go('myday',1); } return; }
    if((x=t.closest('[data-plan-city]'))){ e.preventDefault(); e.stopPropagation(); editing=null; go('plan',x.getAttribute('data-plan-city')); return; }
    if((x=t.closest('[data-tb-res]'))){ e.preventDefault(); e.stopPropagation(); go('results'); return; }
    if((x=t.closest('[data-tb-over]'))){ e.preventDefault(); e.stopPropagation(); go('overview'); return; }
    if((x=t.closest('[data-tb-addstay]'))){ e.preventDefault(); e.stopPropagation(); costsOf(plan).stays.push({name:'',nights:Math.max(1,plan.days.length-1),price:''}); savePlans(); renderOverview(); var ins=overPage.querySelectorAll('.tb-stay input[data-k="name"]'); if(ins.length) ins[ins.length-1].focus(); return; }
    if((x=t.closest('[data-tb-addother]'))){ e.preventDefault(); e.stopPropagation(); costsOf(plan).other.push({name:'',amount:''}); savePlans(); renderOverview(); var io=overPage.querySelectorAll('.tb-other input[data-k="name"]'); if(io.length) io[io.length-1].focus(); return; }
    if((x=t.closest('[data-tb-rm]'))){ e.preventDefault(); e.stopPropagation(); var pr=x.getAttribute('data-tb-rm').split(':'); costsOf(plan)[pr[0]].splice(+pr[1],1); savePlans(); renderOverview(); return; }
    if((x=t.closest('[data-tb-reset]'))){ e.preventDefault(); e.stopPropagation(); var cc=costsOf(plan); cc.food=null; cc.transport=null; cc.activities=null; savePlans(); renderOverview(); return; }
    if((x=t.closest('[data-tb-day]'))){ e.preventDefault(); e.stopPropagation(); go('myday',+x.getAttribute('data-tb-day')); return; }
    if((x=t.closest('[data-tb-del]'))){ e.preventDefault(); e.stopPropagation(); var pd=byId(x.getAttribute('data-tb-del')); if(pd&&!x.classList.contains('tb-arm')){ x.classList.add('tb-arm'); x.textContent='Tap again to delete'; setTimeout(function(){ if(x.isConnected){ x.classList.remove('tb-arm'); x.textContent='Delete'; } },4000); return; }
    if(pd){ plans.splice(plans.indexOf(pd),1); if(plan===pd) plan=plans[plans.length-1]||null; if(!plan&&active==='custom'){ active='none'; ls('tbActive','none'); } savePlans(); renderAll(); } return; }
    if((x=t.closest('[data-tb-example]'))){ e.preventDefault(); e.stopPropagation(); if(x.getAttribute('data-tb-example')==='off'){ active=plan?'custom':'none'; ls('tbActive',active); renderAll(); } else { active='example'; ls('tbActive','example'); renderAll(); cur='home'; wrap.classList.remove('sg-destmode'); location.hash='#day1'; } return; }
    if((x=t.closest('[data-tb-ai]'))){ e.preventDefault(); e.stopPropagation(); dayPage.querySelector('.tb-ai').classList.toggle('open'); return; }
    if((x=t.closest('[data-tb-aigo]'))){ e.preventDefault(); e.stopPropagation(); customise(); return; }
    if((x=t.closest('.sg-adj-main'))){ e.preventDefault(); e.stopPropagation(); editing=null; go('plan',plan?plan.city:'singapore'); return; }
    if((x=t.closest('[data-dest-go]'))){ e.preventDefault(); e.stopPropagation(); var k=x.getAttribute('data-dest-go'); go(k); if(x.hasAttribute('data-rides')){ var r=holder.querySelector('.sg-dest.on .dz-rides'); if(r) setTimeout(function(){ r.scrollIntoView({behavior:'smooth',block:'start'}); },350); } return; }
    if(home.contains(t)){ e.preventDefault(); e.stopPropagation(); if(menu.classList.contains('open')) close(); else open(); return; }
    if(!menu.contains(t)) close();
    if(cur!=='home'&&t.closest('[data-go]')){ cur='home'; wrap.classList.remove('sg-destmode'); markTabs(); }
  },true);
  holder.addEventListener('click',function(e){ var a=e.target.closest('.dz-jump a'); if(!a) return; e.preventDefault(); var el=holder.querySelector(a.getAttribute('href')); if(el) el.scrollIntoView({behavior:'smooth',block:'start'}); });
  document.addEventListener('keydown',function(e){ if(e.key==='Escape') close(); });
  window.addEventListener('resize',close);
  function fromHash(){
    var h=location.hash, m;
    if((m=h.match(/^#dest-([\w-]+)/))) go(m[1],null,true);
    else if((m=h.match(/^#plan(?:-([\w-]+))?$/))) go('plan',m[1],true);
    else if((m=h.match(/^#myday-(\d+)/))) go('myday',+m[1],true);
    else if(h==='#myoverview') go('overview',null,true);
    else if(h==='#myresults') go('results',null,true);
    else if(/^#(day\d+|more|recap)$/.test(h)&&active!=='example'){ active='example'; ls('tbActive','example'); renderAll(); cur='home'; wrap.classList.remove('sg-destmode'); }
    else if(cur!=='home'&&!/^#(day\d+|more|recap)$/.test(h)){ cur='home'; wrap.classList.remove('sg-destmode'); hb.classList.add('pg-on'); markTabs(); }
    else if(cur!=='home'){ cur='home'; wrap.classList.remove('sg-destmode'); markTabs(); }
  }
  window.addEventListener('hashchange',fromHash);
  window.addEventListener('sgpage',function(){ markTabs(); }); // the example plan changes pages without a hashchange

  if(plans.length) askPersist();
  window.sgDest=function(){ return (cur==='home'||cur==='plan'||cur==='myday')?'singapore':cur; };
  renderAll();
  if(/^#(dest-|plan|myday-|myoverview|myresults)/.test(H0)){ try{ history.replaceState(null,'',H0); }catch(e){} fromHash(); }
})();
</script>
